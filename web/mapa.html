<section style="max-width: 1280px; margin: 0 auto; padding: 0 32px 20px">

    <div>

        <button type="button" class="{{stDots}}" onClick="{{setDots}}">Puntitos</button>

  <template sc-if value="{{tl}}" hint-placeholder-val="{{false}}">

      <button type="button" class="tlplay" onClick="{{tlToggle}}" aria-label="{{tlPlayLabel}}">
        <template sc-if value="{{tlPlaying}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg></template>

<section style="max-width: 1280px; margin: 0 auto; padding: 8px 32px 56px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
  <div style="flex: 1 1 520px; min-width: 0; background: #d3d5d2; border: 1.5px solid #b9bdbb; position: relative; overflow: hidden">
    <template sc-if value="{{tour}}" hint-placeholder-val="{{false}}"><div class="prog-tour" aria-hidden="true"></div></template>
    <div class="{{stageCls}}" style="padding: 28px 24px 24px" onPointerDown="{{dragStart}}" onPointerMove="{{dragMove}}" onPointerUp="{{dragEnd}}" onPointerLeave="{{dragEnd}}">
      <div id="tilt3d" class="{{tiltCls}}" style="transform: {{tiltT}}">
        <div class="zoom" style="position: relative; width: 100%; max-width: 540px; margin: 0 auto; aspect-ratio: 420 / 615; transform-origin: {{zoomOrigin}}; transform: scale({{zoomScale}})">
          <template sc-if value="{{d3}}" hint-placeholder-val="{{false}}">
            <template sc-for list="{{bars}}" as="b" hint-placeholder-count="25">
              <div class="b3 b3-in" style="left: {{b.l}}%; top: {{b.t}}%; animation-delay: {{b.delay}}ms">
                <div class="f f1" style="height: {{b.h}}px; background: {{b.c}}"></div>
                <div class="f f2" style="height: {{b.h}}px; background: {{b.c}}"></div>
                <div class="cap" style="transform: translateZ({{b.h}}px); background: {{b.cap}}"></div>
                <template sc-if value="{{b.sel}}" hint-placeholder-val="{{false}}">
                  <div class="lab" style="transform: translateZ({{b.hl}}px) rotateZ({{b.rz}}deg) rotateX({{b.rx}}deg) translate(-50%, -100%)">{{b.name}} · {{b.v}}</div>
                </template>
              </div>
            </template>
          </template>
          <template sc-if value="{{polyOn}}" hint-placeholder-val="{{true}}">
            <template sc-for list="{{deps}}" as="p" hint-placeholder-count="25">
              <svg class="layer" viewBox="0 0 420 615" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none">
                <path class="dep" d="{{p.d}}" fill="{{p.fill}}" stroke="{{p.stroke}}" stroke-width="{{p.sw}}" style="animation-delay: {{p.delay}}ms" onClick="{{p.pick}}" onMouseMove="{{p.move}}" onMouseLeave="{{hideTip}}"></path>
              </svg>
            </template>
          </template>
          <template sc-if value="{{dotStyle}}" hint-placeholder-val="{{false}}">
            <template sc-for list="{{gdots}}" as="g" hint-placeholder-count="200">
              <span class="gm" style="left: {{g.l}}%; top: {{g.t}}%; background: {{g.c}}; transform: translate(-50%, -50%) scale({{g.s}}); animation-delay: {{g.d}}ms"></span>
            </template>
            <div style="position: absolute; inset: 0; cursor: pointer" onMouseMove="{{gMove}}" onMouseLeave="{{gLeave}}" onClick="{{gClick}}" aria-hidden="true"></div>
          </template>
          <template sc-if value="{{dotsFlat}}" hint-placeholder-val="{{false}}">
            <template sc-for list="{{dots}}" as="d" hint-placeholder-count="30">
              <button type="button" class="{{d.cls}}" aria-label="{{d.aria}}" onClick="{{d.pick}}" onMouseMove="{{d.move}}" onMouseLeave="{{hideTip}}" style="left: {{d.l}}%; top: {{d.t}}%; width: {{d.s}}px; height: {{d.s}}px; background: {{d.bg}}; animation-delay: {{d.delay}}ms"></button>
            </template>
          </template>
        </div>
      </div>
    </div>
    <div class="mleg" style="position: absolute; left: 20px; bottom: 20px; background: rgba(244, 245, 243, 0.95); border: 1px solid #b9bdbb; padding: 12px 14px">
      <p style="margin: 0 0 8px; font: 600 15px 'Barlow Condensed', sans-serif">{{legendTitle}}</p>
      <template sc-for list="{{legend}}" as="g" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 3px"><span style="width: 22px; height: 12px; background: {{g.c}}"></span>{{g.t}}</div>
      </template>
      <template sc-if value="{{dotsOn}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #b9bdbb"><span style="width: 12px; height: 12px; border-radius: 50%; background: #1f2326"></span>Obra · <span style="width: 12px; height: 12px; border-radius: 50%; background: #e9a21a"></span>al 90%+</div>
      </template>
    </div>
    <p class="mhint" style="position: absolute; right: 20px; top: 20px; margin: 0; font-size: 14px; color: #5d6468; background: rgba(244, 245, 243, 0.9); padding: 4px 8px">{{mapHint}}</p>
  </div>

  <aside style="flex: 1 1 380px; min-width: 0; background: #f4f5f3; border: 1.5px solid #1f2326; padding: 26px" aria-live="polite">
    <template sc-if value="{{showObra}}" hint-placeholder-val="{{false}}">
      <div class="{{panelCls}}">
        <button type="button" class="btn" onClick="{{backDep}}" style="margin-bottom: 16px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Volver a {{sel.name}}</button>
        <div style="background: #17457a; color: #fff; padding: 22px; position: relative">
          <p style="margin: 0 0 8px; font-size: 13px; color: #c9d6e6">{{obra.nivel}} · {{obra.lugar}}</p>
          <p style="margin: 0; font: 700 22px/1.15 'Barlow Condensed', sans-serif">{{obra.n}}</p>
        </div>
        <dl style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; margin: 20px 0">
          <div><dt style="font-size: 13px; color: #5d6468">Falta ejecutar</dt><dd style="margin: 0; font: 700 30px/1.1 'Barlow Condensed', sans-serif; color: #17457a">{{obra.s}}</dd></div>
          <div><dt style="font-size: 13px; color: #5d6468">Avance físico</dt><dd style="margin: 0; font: 700 30px/1.1 'Barlow Condensed', sans-serif">{{obra.a}}</dd></div>
          <div><dt style="font-size: 13px; color: #5d6468">Servicios de control</dt><dd style="margin: 0; font: 700 30px/1.1 'Barlow Condensed', sans-serif">{{obra.c}}</dd></div>
          <div><dt style="font-size: 13px; color: #5d6468">Puesto en el país</dt><dd style="margin: 0; font: 700 30px/1.1 'Barlow Condensed', sans-serif">{{obra.rank}}</dd></div>
        </dl>
        <div class="meter" style="height: 10px" aria-hidden="true"><i style="width: {{obra.w}}%; background: #e9a21a"></i></div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px">
          <a href="control.html" class="btn">Ver sus informes</a>
        </div>
      </div>
    </template>
    <template sc-if value="{{showDep}}" hint-placeholder-val="{{true}}">
      <div class="{{panelCls}}">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
          <p style="margin: 0; font-size: 14px; color: #5d6468">Puesto {{sel.rank}} de 25 · {{nivelTxt}}</p>
          <div style="display: flex; gap: 6px">
            <button type="button" class="btn" onClick="{{prev}}" aria-label="Departamento anterior" style="padding: 0 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
            <button type="button" class="btn" onClick="{{next}}" aria-label="Departamento siguiente" style="padding: 0 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
          </div>
        </div>
        <h2 style="margin: 4px 0 18px; font: 800 52px/1 'Barlow Condensed', sans-serif">{{sel.name}}</h2>
        <dl style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; margin: 0 0 20px">
          <div><dt style="font-size: 13px; color: #5d6468">Obras paralizadas</dt><dd style="margin: 0; font: 700 30px/1.1 'Barlow Condensed', sans-serif">{{sel.n}}</dd></div>
          <div><dt style="font-size: 13px; color: #5d6468">Falta ejecutar</dt><dd style="margin: 0; font: 700 30px/1.1 'Barlow Condensed', sans-serif; color: #17457a">{{sel.saldo}}</dd></div>
          <div><dt style="font-size: 13px; color: #5d6468">Con presupuesto este año</dt><dd style="margin: 0; font: 700 30px/1.1 'Barlow Condensed', sans-serif">{{sel.pim}}</dd></div>
          <div><dt style="font-size: 13px; color: #5d6468">Servicios de control</dt><dd style="margin: 0; font: 700 30px/1.1 'Barlow Condensed', sans-serif">{{sel.ctrl}}</dd></div>
          <div><dt style="font-size: 13px; color: #5d6468">Costo actualizado (todos)</dt><dd style="margin: 0; font: 700 24px/1.1 'Barlow Condensed', sans-serif">{{sel.costo}}</dd></div>
          <div><dt style="font-size: 13px; color: #5d6468">Avance mediano (todos)</dt><dd style="margin: 0; font: 700 24px/1.1 'Barlow Condensed', sans-serif">{{sel.av}}</dd></div>
        </dl>
        <h3 style="margin: 0 0 10px; font: 700 20px 'Barlow Condensed', sans-serif">Causas más frecuentes</h3>
        <div style="display: grid; gap: 10px; margin-bottom: 22px">
          <template sc-for list="{{sel.causas}}" as="c" hint-placeholder-count="3">
            <div class="cz"><span>{{c.n}}</span><b style="text-align: right; font: 700 17px 'Barlow Condensed', sans-serif">{{c.v}}</b><span class="b" aria-hidden="true"><i style="width: {{c.w}}%"></i></span></div>
          </template>
        </div>
        <h3 style="margin: 0 0 6px; font: 700 20px 'Barlow Condensed', sans-serif">Frente al promedio del país</h3>
        <div style="display: grid; gap: 10px; margin-bottom: 22px">
          <template sc-for list="{{sel.vs}}" as="x" hint-placeholder-count="5">
            <div class="vsr">
              <span style="font-size: 14px">{{x.l}}</span>
              <b style="text-align: right; font: 700 17px 'Barlow Condensed', sans-serif; color: {{x.c}}">{{x.v}}</b>
              <span class="vtrack" aria-hidden="true"><i style="width: {{x.w}}%; background: {{x.c}}"></i><em style="left: {{x.n}}%"></em></span>
              <span style="grid-column: 1 / -1; font-size: 12.5px; color: #5d6468">{{x.note}}</span>
            </div>
          </template>
        </div>
        <h3 style="margin: 0; font: 700 20px 'Barlow Condensed', sans-serif">Quién las ejecuta</h3>
        <div class="mix" role="img" aria-label="{{sel.mixAria}}">
          <span style="flex-grow: {{sel.mL}}; flex-basis: 0; background: #17457a"></span>
          <span style="flex-grow: {{sel.mR}}; flex-basis: 0; background: #5b84ad"></span>
          <span style="flex-grow: {{sel.mN}}; flex-basis: 0; background: #e9a21a"></span>
        </div>
        <p style="margin: 0 0 18px; font-size: 13px; color: #5d6468"><span style="color: #17457a; font-weight: 600">■</span> Municipalidades {{sel.mL}} · <span style="color: #5b84ad; font-weight: 600">■</span> Regionales {{sel.mR}} · <span style="color: #8a5a00; font-weight: 600">■</span> Nacional {{sel.mN}}</p>
        <h3 style="margin: 0; font: 700 20px 'Barlow Condensed', sans-serif">Qué se paró</h3>
        <div style="margin-bottom: 20px">
          <template sc-for list="{{sel.tipos}}" as="t" hint-placeholder-count="6">
            <div class="tb"><span>{{t.n}}</span><b style="text-align: right; font: 700 15px 'Barlow Condensed', sans-serif">{{t.v}}</b><span class="b" aria-hidden="true"><i style="width: {{t.w}}%"></i></span></div>
          </template>
        </div>
        <h3 style="margin: 0 0 4px; font: 700 20px 'Barlow Condensed', sans-serif">{{topTitle}}</h3>
        <template sc-for list="{{sel.top}}" as="o" hint-placeholder-count="3">
          <button type="button" class="obra" onClick="{{o.pick}}">
            <span style="font-size: 14.5px; line-height: 1.35">{{o.n}}</span>
            <b style="font: 700 19px 'Barlow Condensed', sans-serif; white-space: nowrap">{{o.s}}</b>
            <span class="meter" aria-hidden="true"><i style="width: {{o.a}}%"></i></span>
            <span style="grid-column: 1 / -1; font-size: 13px; color: #5d6468">{{o.meta}}</span>
          </button>
        </template>
        <template sc-if value="{{noTop}}" hint-placeholder-val="{{false}}"><p style="margin: 8px 0 0; font-size: 14px; color: #5d6468">Ninguna de las 90 obras más grandes del país es de este nivel aquí.</p></template>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px">
          <a href="comparar.html" class="btn">Comparar con otro</a>
          <a href="control.html" class="btn">Ver sus controles</a>
        </div>
      </div>
    </template>
  </aside>
</section>

<template sc-if value="{{tipOn}}" hint-placeholder-val="{{false}}">

    <span style="display: block; color: #c9d1d6; margin-top: 2px">{{tip.l1}}</span>

        <span class="bar" aria-hidden="true"><i style="width: {{r.w}}%"></i></span>

<div class="tape" aria-hidden="true"></div>
<section class="sec2" id="burbujas">
  <p class="kick2">CADA DEPARTAMENTO, UNA BURBUJA</p>
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 24px">
    <h2 class="h2b" style="max-width: 20ch">Muchas obras chicas o pocas obras enormes</h2>
    <p style="margin: 0; color: #5d6468; max-width: 44ch">Horizontal: número de obras. Vertical: lo que falta ejecutar (escala logarítmica). Tamaño: servicios de control. Clic en una burbuja para verla en el mapa.</p>
  </div>
  <div class="plot" onMouseLeave="{{bLeave}}">
    <template sc-for list="{{yTicks}}" as="t" hint-placeholder-count="4">
      <span style="position: absolute; left: -54px; bottom: {{t.b}}%; transform: translateY(50%); font-size: 12px; color: #5d6468; width: 48px; text-align: right">{{t.l}}</span>
      <span style="position: absolute; left: 0; right: 0; bottom: {{t.b}}%; border-top: 1px dashed #d3d5d2"></span>
    </template>
    <template sc-for list="{{xTicks}}" as="t" hint-placeholder-count="5">
      <span style="position: absolute; bottom: -26px; left: {{t.l}}%; transform: translateX(-50%); font-size: 12px; color: #5d6468">{{t.t}}</span>

      <p style="margin: 6px 0 0; font-size: 14px; color: #c9d1d6">{{bInfo.l}}</p>

<section class="sec2" id="carrera" style="padding-top: 24px">
  <p class="kick2">LA CARRERA</p>
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px">
    <h2 class="h2b">Quién fue acumulando más, año por año</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <div style="display: flex" role="group" aria-label="Medir por"><template sc-for list="{{rMetrics}}" as="m" hint-placeholder-count="2"><button type="button" class="{{m.cls}}" onClick="{{m.pick}}">{{m.l}}</button></template></div>

        <template sc-if value="{{notRacing}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></template>
      </button>
    </div>
  </div>
  <div style="position: relative">
    <p aria-live="polite" style="position: absolute; right: 0; bottom: 20px; margin: 0; font: 800 clamp(80px, 12vw, 180px)/1 'Barlow Condensed', sans-serif; color: rgba(31, 35, 38, 0.1); pointer-events: none">{{raceYr}}</p>
    <div class="race">

        <div class="rrow" style="top: {{r.top}}px">
          <span style="text-align: right; font-weight: 600; font-size: 15px">{{r.n}}</span>
          <span class="rbw"><span class="rb" style="width: {{r.w}}%; background: {{r.c}}"></span><span class="rval">{{r.v}}</span></span>
        </div>
      </template>

      cls: st.obra === i ? 'od on' : 'od', delay: 200 + i * 12,
      aria: `${o[3]}, falta ${M(o[4])}`,
      pick: () => this.setState({ obra: i, sel: o[2], flip: !st.flip, tour: false }),
      move: (e) => tipAt(e, o[3], `${o[6]} · ${o[5] == null ? 'avance sin dato' : nf1.format(o[5]) + '% de avance'}`, `Falta ${M(o[4])}`),
    }));
    const ord = this.order();
    const rankIdx = ord.indexOf(st.sel);
    const step = (k) => () => this.setState({ sel: ord[(rankIdx + k + ord.length) % ord.length], obra: null, flip: !st.flip, tour: false });
    const legend = ramp.map((c, i) => ({ c, t: i === 0 ? `hasta ${metric.fmt(cuts[0])}` : i === 4 ? `más de ${metric.fmt(cuts[3])}` : `hasta ${metric.fmt(cuts[i])}` }));
    const max = Math.max(...DEP.map(v), 1e-9);
    const ranking = ord.map((u) => ({
      name: byU[u][1], w: ((v(byU[u]) / max) * 100).toFixed(1), v: metric.fmt(v(byU[u])),
      cls: u === st.sel ? 'rank on' : 'rank', pick: pick(u),
    }));
    const n = st.nivel === 'T' ? [sel[2], sel[3], sel[6], sel[7]] : (([a, b, c, d]) => [a, b, c, d])(NIV[sel[0]][st.nivel]);
    const cau = CAU[sel[0]] || [];
    const cauMax = Math.max(1, ...cau.map((c) => c[1]));
    const topAll = sel[9].map((o) => {
      const di = DOTS.findIndex((d) => d[2] === sel[0] && Math.abs(d[4] - o[1]) < 0.15);
      return { n: o[0], s: M(o[1]), a: o[2] ?? 0, meta: `${o[2] == null ? 'Avance sin dato' : nf1.format(o[2]) + '% de avance'} · ${o[3]}`, pick: di >= 0 ? () => this.setState({ obra: di, flip: !st.flip }) : () => {} };
    });
    const topNivel = DOTS.map((d, i) => ({ d, i })).filter(({ d }) => d[2] === sel[0] && d[7] === st.nivel).slice(0, 3)
      .map(({ d, i }) => ({ n: d[3], s: M(d[4]), a: d[5] ?? 0, meta: `${d[5] == null ? 'Avance sin dato' : nf1.format(d[5]) + '% de avance'} · ${d[6]}`, pick: () => this.setState({ obra: i, flip: !st.flip }) }));
    const top = st.nivel === 'T' ? topAll : topNivel;
    const ob = st.obra != null ? DOTS[st.obra] : null;
    const cen = CEN[st.sel];
    const qs = st.q.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const res = qs.length < 2 ? [] : DEP.filter((d) => d[1].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(qs)).slice(0, 6);
    const tg = (on) => (on ? 'tg on' : 'tg');
    const vMax = Math.max(...DEP.map(v), 1e-9);
    const shade = (x) => (x > 0 ? color(x) : '#d3d5d2');
    const bars = DEP.map((d, i) => {
      const x = v(d), h = Math.round(6 + 190 * (x / vMax));
      const c = CEN[d[0]];
      return {
        l: (c[0] / 420 * 100).toFixed(2), t: (c[1] / 615 * 100).toFixed(2), h, hl: h + 14,
        c: d[0] === st.sel ? '#e9a21a' : shade(x), cap: d[0] === st.sel ? '#ffd27a' : '#e3e7ea',
        sel: d[0] === st.sel, name: d[1], v: metric.fmt(x), rz: -st.rz, rx: -st.rx, delay: i * 30,
      };
    });
    const TIPOS = ['Saneamiento urbano y rural', 'Transporte terrestre', 'Riego', 'Otra infraestructura', 'Transporte urbano', 'Educación básica', 'Otros tipos'];
    const prof = this.PROF()[st.sel];
    const tMax = Math.max(...prof[0], 1);
    const { cells, at } = this.GRID();
    const gdots = st.style === 'dots' ? cells.map(([x, y, u]) => ({
      l: (((x - 0.5) * 9) / 420 * 100).toFixed(2), t: (((y - 0.5) * 9) / 615 * 100).toFixed(2),
      c: u === st.sel ? '#e9a21a' : color(v(byU[u])),
      s: u === st.gh ? 1.5 : u === st.sel ? 1.25 : 1, d: 100 + y * 12,
    })) : [];
    const gAt = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * 420, y = ((e.clientY - r.top) / r.height) * 615;
      return at[`${Math.round(x / 9 + 0.5)},${Math.round(y / 9 + 0.5)}`];
    };
    const tlActive = st.tl && st.yr < 2026;

    // ----- frente al promedio nacional -----
    const VSDEF = [
      ['Avance mediano', (d) => d[5], 57.3, (x) => `${nf1.format(x)}%`],
      ['Falta ejecutar por obra', (d) => d[3] / d[2], 27548 / 2262, (x) => `S/ ${nf1.format(x)} M`],
      ['Controles por obra', (d) => d[6] / d[2], 4386 / 2262, (x) => nf1.format(x)],
      ['Con presupuesto este año', (d) => (d[7] / d[2]) * 100, (749 / 2262) * 100, (x) => `${Math.round(x)}%`],
      ['Al 90% o más', (d) => (d[8] / d[2]) * 100, (286 / 2262) * 100, (x) => `${nf1.format(x)}%`],
    ];
    const VS = VSDEF.map(([l, g, nat, f]) => {
      const x = g(sel), mx = Math.max(...DEP.map(g), nat);
      const r = x / nat;
      return {
        l, v: f(x), w: ((x / mx) * 100).toFixed(1), n: ((nat / mx) * 100).toFixed(1), c: x >= nat ? '#17457a' : '#9aa1a5',
        note: `País: ${f(nat)} · ${r >= 1.15 ? `${nf1.format(r)} veces el promedio` : r <= 0.87 ? 'por debajo del promedio' : 'cerca del promedio'}`,
      };
    });

    // ----- burbujas -----
    const lx = (o) => 4 + (o / 380) * 92;
    const lgMin = Math.log10(80), lgMax = Math.log10(9000);
    const ly = (s) => 4 + ((Math.log10(Math.max(s, 80)) - lgMin) / (lgMax - lgMin)) * 92;
    const bsz = (c) => 14 + 46 * Math.sqrt(c / 432);
    const bubbles = DEP.map((d, i) => {
      const s = bsz(d[6]), on = d[0] === st.sel, hv = d[0] === st.bh;
      return {
        x: lx(d[2]).toFixed(2), y: ly(d[3]).toFixed(2), s: s.toFixed(1), r: (s / 2).toFixed(1),
        c: on ? '#e9a21a' : color(v(d)), cls: on ? 'bub on' : 'bub', d: 200 + i * 40,
        lab: on || hv || d[2] > 160 || d[3] > 1600 ? d[1] : '',
        aria: `${d[1]}: ${d[2]} obras, ${M(d[3])}, ${d[6]} controles`,
        pick: pick(d[0]), hover: () => this.setState({ bh: d[0] }),
      };
    });
    const bd = byU[st.bh || st.sel];
    const bInfo = { n: bd[1], l: `${nf.format(bd[2])} obras · ${M(bd[3])} · ${nf.format(bd[6])} controles` };

    // ----- carrera de barras -----
    const CUMD = this.CUM();
    const ri = st.rm === 'obras' ? 0 : 1;
    const rv = DEP.map((d) => [d, CUMD[d[0]][ri][st.ryi]]).sort((a, b) => b[1] - a[1]);
    const rMax = Math.max(rv[0][1], 1e-9);
    const rank = Object.fromEntries(rv.map(([d], k) => [d[0], k]));
    const raceRows = DEP.map((d) => {
      const val = CUMD[d[0]][ri][st.ryi];
      return {
        n: d[1], top: rank[d[0]] * 34, w: Math.max(0.3, (val / rMax) * 78).toFixed(1),
        c: d[0] === st.sel ? '#e9a21a' : rank[d[0]] < 3 ? '#123a66' : '#5b84ad',
        v: val ? (st.rm === 'obras' ? nf.format(val) : M(val)) : '',
      };
    });

    // ----- explorador -----
    const NIVN = { L: 'Municipal', R: 'Regional', N: 'Nacional' };
    const qx = st.xq.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    let xr = DOTS.map((d, i) => ({ d, i })).filter(({ d }) =>
      (!st.fdep || d[2] === st.sel) && (!st.fcasi || (d[5] ?? 0) >= 90) && (!st.fsin || d[8] === 0) &&
      (!qx || `${d[3]} ${d[6]} ${byU[d[2]][1]}`.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(qx)));
    const XC = [['n', 'Obra', (r) => r.d[3], 'left'], ['dep', 'Departamento', (r) => byU[r.d[2]][1], 'left'], ['niv', 'Nivel', (r) => r.d[7], 'left'], ['s', 'Falta ejecutar', (r) => r.d[4], 'right'], ['a', 'Avance', (r) => r.d[5] ?? -1, 'right'], ['c', 'Controles', (r) => r.d[8], 'right']];
    const sk = XC.find((c) => c[0] === st.xs);
    xr = [...xr].sort((a, b) => { const x = sk[2](a), y = sk[2](b); return (typeof x === 'string' ? x.localeCompare(y, 'es') : x - y) * st.xd; });
    return {
      sel2: null,
      bubbles, bInfo, bLeave: () => this.setState({ bh: null }),
      yTicks: [100, 300, 1000, 3000].map((s) => ({ b: ly(s).toFixed(1), l: s >= 1000 ? `S/ ${s / 1000} mil M` : `S/ ${s} M` })),
      xTicks: [0, 100, 200, 300].map((o) => ({ l: lx(o).toFixed(1), t: `${o} obras` })),
      rMetrics: [['saldo', 'Falta ejecutar'], ['obras', 'Obras']].map(([k, l]) => ({ l, cls: st.rm === k ? 'fchip on' : 'fchip', pick: () => this.setState({ rm: k }) })),
      raceRows, raceYr: 2007 + st.ryi, racing: st.racing, notRacing: !st.racing,
      raceLabel: st.racing ? 'Pausar la carrera' : 'Reproducir la carrera',
      raceToggle: () => this.setState({ racing: !st.racing, ryi: !st.racing && st.ryi >= 19 ? 0 : st.ryi }),
      xq: st.xq, onXq: (e) => this.setState({ xq: e.target.value }),
      fDep: st.fdep ? 'fchip on' : 'fchip', fCasi: st.fcasi ? 'fchip on' : 'fchip', fSin: st.fsin ? 'fchip on' : 'fchip',
      tDep: () => this.setState({ fdep: !st.fdep }), tCasi: () => this.setState({ fcasi: !st.fcasi }), tSin: () => this.setState({ fsin: !st.fsin }),
      xCount: `${xr.length} ${xr.length === 1 ? 'obra' : 'obras'}${xr.length ? `, suman ${M(xr.reduce((s, r) => s + r.d[4], 0))} por ejecutar` : ''}`,
      xCols: XC.map(([k, l, , al]) => ({
        l, al, cls: st.xs === k ? 'on' : '', arrow: st.xs === k ? (st.xd < 0 ? '↓' : '↑') : '',
        sort: st.xs === k ? (st.xd < 0 ? 'descending' : 'ascending') : 'none',
        pick: () => this.setState({ xs: k, xd: st.xs === k ? -st.xd : (al === 'right' ? -1 : 1) }),
      })),
      xRows: xr.map(({ d, i }, k) => ({
        n: d[3], dep: byU[d[2]][1], niv: NIVN[d[7]], s: M(d[4]),
        a: d[5] == null ? 'Sin dato' : `${nf1.format(d[5])}%`, aw: d[5] ?? 0, ac: (d[5] ?? 0) >= 90 ? '#e9a21a' : '#17457a',
        c: nf.format(d[8]), d: Math.min(k, 15) * 25,
        pick: () => { this.setState({ obra: i, sel: d[2], flip: !st.flip, tour: false }); window.scrollTo({ top: 0, behavior: 'smooth' }); },
      })),
      polyOn: st.style !== 'dots', dotStyle: st.style === 'dots', gdots,
      stPoly: st.style === 'dots' ? '' : 'on', stDots: st.style === 'dots' ? 'on' : '',
      setPoly: () => this.setState({ style: 'poly' }),
      setDots: () => this.setState({ style: 'dots', tilt: false }),
      gMove: (e) => {
        const u = gAt(e);
        if (u !== this.state.gh) this.setState({ gh: u || null });
        if (u) tipAt(e, byU[u][1], metric.fmt(v(byU[u])), `${nf.format(byU[u][2])} obras en total`);
        else this.setState({ tip: null });
      },
      gLeave: () => this.setState({ gh: null, tip: null }),
      gClick: (e) => { const u = gAt(e); if (u) pick(u)(); },
      tl: st.tl, tgTl: tg(st.tl), tlOn: String(st.tl),
      toggleTl: () => this.setState({ tl: !st.tl, yr: st.tl ? 2026 : 2010, tlPlay: !st.tl, metric: st.metric === 'ctrl' || st.metric === 'pim' ? 'saldo' : st.metric }),
      yr: st.yr,
      onYr: (e) => this.setState({ yr: Number(e.target.value), tlPlay: false }),
      tlPlaying: st.tlPlay, tlStopped: !st.tlPlay,
      tlPlayLabel: st.tlPlay ? 'Pausar' : 'Reproducir',
      tlToggle: () => this.setState({ tlPlay: !st.tlPlay, yr: !st.tlPlay && st.yr >= 2026 ? 2007 : st.yr }),
      tlNote: st.metric === 'ctrl' || st.metric === 'pim'
        ? 'La línea de tiempo solo aplica a obras y a falta ejecutar.'
        : `Obras paralizadas que empezaron hasta ${st.yr}${st.nivel !== 'T' ? ' (todos los niveles)' : ''}. ${tlActive ? '' : 'En 2026 se ven todas. '}45 obras sin año de inicio no entran.`,
      d3: st.tilt,
      dotsFlat: st.dots && !st.tilt,
      bars,
      stageCls: st.tilt ? (st.drag ? 'stage d3 drag' : 'stage d3') : 'stage',
      tiltT: st.tilt ? `rotateX(${st.rx}deg) rotateZ(${st.rz}deg) translateY(-20px)` : 'none',
      tgSpin: tg(st.spin), spinOn: String(st.spin),
      toggleSpin: () => this.setState({ spin: !st.spin }),
      dragStart: (e) => {
        if (!st.tilt) return;
        this.moved = false;
        this.d0 = { x: e.clientX, y: e.clientY, rx: st.rx, rz: st.rz };
        this.setState({ drag: true });
      },
      dragMove: (e) => {
        if (!this.state.drag || !this.d0) return;
        const dx = e.clientX - this.d0.x, dy = e.clientY - this.d0.y;
        if (Math.abs(dx) + Math.abs(dy) > 4) this.moved = true;
        this.state.rz = this.d0.rz - dx * 0.4;
        this.state.rx = Math.max(15, Math.min(72, this.d0.rx - dy * 0.3));
        this.apply3D();
      },
      dragEnd: () => {
        if (!st.drag) return;
        this.d0 = null;
        this.setState({ drag: false });
        setTimeout(() => { this.moved = false; }, 0);
      },
      q: st.q, onQ: (e) => this.setState({ q: e.target.value }),
      hasRes: qs.length >= 2,
      res: res.length ? res.map((d) => ({ name: d[1], label: `${nf.format(d[2])} obras`, pick: pick(d[0]) })) : [{ name: 'Sin resultados', label: 'prueba sin tildes', pick: () => {} }],
      metrics: METRICS.map((m) => ({ label: m.label, cls: m.id === metric.id ? 'on' : '', pressed: String(m.id === metric.id), pick: () => this.setState({ metric: m.id }) })),
      niveles: Object.keys(NIVEL).map((k) => ({ label: NIVEL[k], cls: k === st.nivel ? 'on' : '', pressed: String(k === st.nivel), pick: () => this.setState({ nivel: k, obra: null }) })),
      tgDots: tg(st.dots), tgZoom: tg(st.zoom), tgTilt: tg(st.tilt), tgTour: tg(st.tour),
      dotsOn: st.dots, zoomOn: String(st.zoom), tiltOn: String(st.tilt), tourOn: String(st.tour), tour: st.tour,
      toggleDots: () => this.setState({ dots: !st.dots }),
      toggleZoom: () => this.setState({ zoom: !st.zoom }),
      toggleTilt: () => this.setState({ tilt: !st.tilt }),
      toggleTour: () => this.setState({ tour: !st.tour, obra: null }),
      tiltCls: `tilt${st.tilt ? ' on' : ''}${st.drag || st.spin ? '' : ' anim'}`,
      zoomOrigin: `${(cen[0] / 420 * 100).toFixed(1)}% ${(cen[1] / 615 * 100).toFixed(1)}%`,
      zoomScale: st.zoom ? (st.sel === '16' ? 1.5 : 2.4) : 1,
      deps, dots, legend, ranking,
      legendTitle: `${metric.label}${st.nivel === 'T' ? '' : ' · ' + NIVEL[st.nivel]}`,
      mapHint: st.tour ? 'Recorriendo de mayor a menor…' : st.tilt ? 'Arrastra para girar · la altura es ' + metric.label.toLowerCase() : st.dots ? 'Clic en un departamento o en una obra' : 'Clic en un departamento',
      rankNote: `Ordenados por ${metric.label.toLowerCase()}${st.nivel === 'T' ? '' : ', solo ' + NIVEL[st.nivel].toLowerCase()}. Clic para verlo en el mapa.`,
      tipOn: Boolean(st.tip), tip: st.tip || { x: 0, y: 0, t: '', l1: '', l2: '' },
      hideTip: () => this.setState({ tip: null }),
      panelCls: st.flip ? 'panel-a' : 'panel-b',
      showObra: Boolean(ob), showDep: !ob,
      backDep: () => this.setState({ obra: null, flip: !st.flip }),
      obra: ob ? {
        n: ob[3], lugar: `${ob[6]}, ${byU[ob[2]][1]}`, nivel: NIVEL[ob[7]], s: M(ob[4]),
        a: ob[5] == null ? 'Sin dato' : `${nf1.format(ob[5])}%`, w: ob[5] ?? 0, c: nf.format(ob[8]), rank: `N.° ${st.obra + 1}`,
      } : { n: '', lugar: '', nivel: '', s: '', a: '', w: 0, c: '', rank: '' },
      nivelTxt: st.nivel === 'T' ? `por ${metric.label.toLowerCase()}` : NIVEL[st.nivel],
      prev: step(-1), next: step(1),
      topTitle: st.nivel === 'T' ? 'Las tres obras con más dinero pendiente' : `Sus obras grandes · ${NIVEL[st.nivel]}`,
      noTop: top.length === 0,
      sel: {
        name: sel[1], rank: rankIdx + 1, n: nf.format(n[0]), saldo: M(n[1]), ctrl: nf.format(n[2]),
        pim: n[0] ? `${n[3]} de ${n[0]}` : '—', costo: M(sel[4]), av: `${nf1.format(sel[5])}%`,
        causas: cau.map((c) => ({ n: c[0], v: nf.format(c[1]), w: ((c[1] / cauMax) * 100).toFixed(0) })),
        top,
        mL: prof[1][0], mR: prof[1][1], mN: prof[1][2],
        mixAria: `Municipalidades ${prof[1][0]}, gobiernos regionales ${prof[1][1]}, gobierno nacional ${prof[1][2]}`,
        tipos: TIPOS.map((n, i) => ({ n, v: prof[0][i], w: ((prof[0][i] / tMax) * 100).toFixed(0) })).filter((t) => t.v > 0),
        vs: VS,
      },
    };
  }
}
</script>
