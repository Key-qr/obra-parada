<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obra Parada · Comparar</title>
<meta name="description" content="Compara dos departamentos: obras, dinero pendiente, avance, presupuesto, servicios de control y cada obra como un punto.">
<meta property="og:title" content="Obra Parada · Comparar">
<meta property="og:description" content="Compara dos departamentos: obras, dinero pendiente, avance, presupuesto, servicios de control y cada obra como un punto.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="vendor/fonts.css" rel="stylesheet">
<style>
body{margin:0;background:#e3e4e1;color:#1f2326;font-family:'Barlow',system-ui,sans-serif;overflow-x:clip}
a{color:#17457a}a:hover{color:#0f3359}
*{box-sizing:border-box}
.prog{position:fixed;top:0;left:0;right:0;height:4px;background:#e9a21a;transform-origin:0 50%;transform:scaleX(0);z-index:60}
@supports (animation-timeline: scroll()){.prog{animation:prog linear both;animation-timeline:scroll(root)}}
@keyframes prog{to{transform:scaleX(1)}}
.brand{display:inline-flex;align-items:center;gap:10px;font:800 24px/1 'Barlow Condensed',sans-serif;color:#1f2326;text-decoration:none}
.brand:hover{color:#1f2326}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font:600 18px/1 'Barlow Condensed',sans-serif;color:#1f2326;text-decoration:none}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:3px;background:#e9a21a;transform:scaleX(0);transform-origin:0 50%;transition:transform .25s ease}
.nav a:hover::after{transform:scaleX(1)}
.nav a.on{background:#1f2326;color:#fff}
.nav a.on::after{display:none}
.tape{height:14px;background:repeating-linear-gradient(45deg,#e9a21a 0 10px,#1f2326 10px 20px);background-size:28.28px 14px;animation:tape 1.4s linear infinite}
@keyframes tape{to{background-position:28.28px 0}}
.sel{min-height:52px;width:100%;padding:0 14px;font:700 24px 'Barlow Condensed',sans-serif;border:2px solid #1f2326;background:#fff;color:#1f2326;border-radius:0;cursor:pointer}
.swap{width:56px;height:56px;border-radius:50%;border:1.5px solid #1f2326;background:#f4f5f3;cursor:pointer;display:grid;place-items:center;transition:transform .45s cubic-bezier(.2,.9,.3,1.4),background-color .2s}
.swap:hover{background:#e9a21a;transform:rotate(180deg)}
.dp{transition:fill .6s ease}
.otabs{display:flex;border:1.5px solid #1f2326;background:#f4f5f3}
.otabs button{min-height:44px;padding:0 16px;border:0;border-left:1.5px solid #1f2326;background:transparent;font:600 17px 'Barlow Condensed',sans-serif;color:#1f2326;cursor:pointer;transition:background-color .2s,color .2s}
.otabs button:first-child{border-left:0}
.otabs button:hover{background:#e8ebee}
.otabs button.on{background:#1f2326;color:#fff}
.ostage{position:relative;height:580px;overflow:hidden;background:#e3e4e1;border-top:2px solid #1f2326;border-bottom:1px solid #b9bdbb;cursor:crosshair}
.obg{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#cfd2cf;transition:opacity .6s;pointer-events:none}
.olab{position:absolute;white-space:nowrap;pointer-events:none;animation:labIn .5s ease-out backwards}
@keyframes labIn{from{opacity:0}}
.od{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;transition-property:left,top,transform,box-shadow;transition-duration:.9s,.9s,.2s,.2s;transition-timing-function:cubic-bezier(.3,.7,.2,1)}
.od.hv{transform:translate(-50%,-50%) scale(2.2);box-shadow:0 0 0 1.5px #1f2326;z-index:5}
.od.sel{transform:translate(-50%,-50%) scale(2.2);box-shadow:0 0 0 2px #fff,0 0 0 4px #1f2326;z-index:6}
.otip{position:absolute;z-index:10;width:270px;background:#1f2326;color:#fff;padding:12px 14px;border-left:4px solid #e9a21a;pointer-events:none;animation:labIn .15s ease-out}
.ofi{position:relative;background:#17457a;color:#fff;padding:26px 30px;margin-top:18px;max-width:760px;animation:cuelga .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes cuelga{from{opacity:0;transform:translateY(-14px) rotate(-1deg)}}
.ofi .bolt{position:absolute;width:9px;height:9px;border-radius:50%;background:#c9d6e6;box-shadow:inset 0 0 0 2px #0f3359}
.ofr{display:grid;grid-template-columns:10em minmax(0,1fr);gap:14px;padding:10px 0;border-top:1px solid rgba(255,255,255,.18)}
.ofr dt{font:600 14px 'Barlow Condensed',sans-serif;letter-spacing:.06em;color:#c9d6e6}
.ofr dd{margin:0;font:600 20px/1.2 'Barlow Condensed',sans-serif}
@media (max-width:640px){.ofr{grid-template-columns:1fr;gap:2px}.ostage{height:520px}}
.cd{position:absolute;width:1.7%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#c3c7c4;pointer-events:none;transition:background-color .3s,transform .25s}
.cd.hv{background:#5d6468;transform:translate(-50%,-50%) scale(1.3)}
.cd.ona{background:#17457a;transform:translate(-50%,-50%) scale(1.35)}
.cd.onb{background:#e9a21a;transform:translate(-50%,-50%) scale(1.35)}
.wa .cd.ona,.wa .cd.onb{animation:olaA .5s cubic-bezier(.2,.9,.3,1.6) backwards}
.wb .cd.ona,.wb .cd.onb{animation:olaB .5s cubic-bezier(.2,.9,.3,1.6) backwards}
@keyframes olaA{from{transform:translate(-50%,-50%) scale(0)}}
@keyframes olaB{from{transform:translate(-50%,-50%) scale(0)}}
.ax{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 7em 7em;gap:10px;padding:8px 10px;border-top:1px solid #b9bdbb;transition:background-color .15s}
.ax:hover,.ax.on{background:#fbe7bd}
.ax:focus-visible{outline:3px solid #e9a21a}
.rda .rpa,.rda .rpb{animation:radA .7s cubic-bezier(.2,.9,.3,1.3) backwards;transform-origin:0 0}
.rdb .rpa,.rdb .rpb{animation:radB .7s cubic-bezier(.2,.9,.3,1.3) backwards;transform-origin:0 0}
.rpb{animation-delay:.12s!important}
@keyframes radA{from{transform:scale(0)}}
@keyframes radB{from{transform:scale(0)}}
.pbar{display:flex;height:46px;gap:2px}
.pbar span{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;font:700 15px 'Barlow Condensed',sans-serif;cursor:default;transition:flex-grow .7s cubic-bezier(.2,.8,.2,1),filter .2s}
.pbar span:hover{filter:brightness(1.15)}
.pfa .pbar span{animation:crece .6s ease-out backwards}
.pfb .pbar span{animation:crece2 .6s ease-out backwards}
@keyframes crece{from{flex-grow:0}}
@keyframes crece2{from{flex-grow:0}}
.lg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:4px 6px}
.lg.on{background:#fbe7bd;font-weight:600}
.ln{stroke-dasharray:3000;animation:dibuja 1.4s ease-out}
.ln2{stroke-dasharray:3000;animation:dibuja2 1.4s ease-out}
@keyframes dibuja{from{stroke-dashoffset:3000}}
@keyframes dibuja2{from{stroke-dashoffset:3000}}
.dice{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 20px;background:#1f2326;color:#fff;border:0;font:700 19px 'Barlow Condensed',sans-serif;cursor:pointer;transition:transform .2s}
.dice:hover{transform:translateY(-2px)}
.dice svg{transition:transform .5s cubic-bezier(.2,.9,.3,1.4)}
.dice:hover svg{transform:rotate(200deg)}
.beam{position:absolute;left:8%;right:8%;top:70px;height:12px;background:#1f2326;transform-origin:50% 50%;transition:transform 1.4s cubic-bezier(.3,1.6,.4,1)}
.pan{position:absolute;top:6px;width:0;transform-origin:50% 0;display:flex;flex-direction:column;align-items:center;transition:transform 1.4s cubic-bezier(.3,1.6,.4,1)}
.pan .rope{width:2px;height:48px;background:#5d6468}
.pan .plate{width:170px;min-height:84px;margin-left:0;padding:10px;text-align:center;border-top:6px solid #1f2326;background:#f4f5f3;box-shadow:0 12px 20px -14px rgba(0,0,0,.5)}
.vs{font:800 72px/1 'Barlow Condensed',sans-serif;color:#e9a21a;-webkit-text-stroke:2px #1f2326}
@media (max-width:640px){.beam{left:22%;right:22%}.pan .plate{width:124px;padding:8px 6px}.pan .plate p:last-child{font-size:22px!important}}
.vs-a{animation:sello .6s cubic-bezier(.2,.9,.3,1.5)}
.vs-b{animation:sello2 .6s cubic-bezier(.2,.9,.3,1.5)}
@keyframes sello{from{transform:scale(2.4) rotate(-14deg);opacity:0}}
@keyframes sello2{from{transform:scale(2.4) rotate(14deg);opacity:0}}
.mchip{min-height:40px;padding:0 14px;border:1.5px solid #1f2326;background:#f4f5f3;font:600 16px 'Barlow Condensed',sans-serif;cursor:pointer;margin-left:-1.5px}
.mchip.on{background:#1f2326;color:#fff}
.row.win-a .va,.row.win-b .vb{text-decoration:underline;text-decoration-color:#e9a21a;text-decoration-thickness:3px;text-underline-offset:5px}
.map-a{animation:pulsoA .6s ease-out}
.map-b{animation:pulsoB .6s ease-out}
@keyframes pulsoA{from{transform:scale(.96);opacity:.4}}
@keyframes pulsoB{from{transform:scale(.96);opacity:.4}}
.row{display:grid;grid-template-columns:7em minmax(0,1fr) minmax(8em,12em) minmax(0,1fr) 7em;gap:14px;align-items:center;padding:12px 0;border-top:1px solid #b9bdbb}
.row:hover{background:#f4f5f3}
.tl{height:20px;background:#d3d5d2;display:flex;justify-content:flex-end}
.tr{height:20px;background:#d3d5d2;display:flex}
.tl i,.tr i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.tl i{background:#17457a}
.tr i{background:#e9a21a}
.win{font:700 20px 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
@supports (animation-timeline: view()){.rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 25%}}
@keyframes rv{from{opacity:0;transform:translateY(40px)}}
@media (max-width:760px){.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 12px}.row .lab{grid-column:1/-1;grid-row:1;text-align:left!important}.row .tl,.row .tr{display:none}}
@media (max-width:760px){
header .nav,header nav.sub{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
header .nav{margin-left:0!important;width:100%}
header .nav::-webkit-scrollbar,header nav.sub::-webkit-scrollbar{display:none}
header .nav a{flex:0 0 auto;min-height:40px;padding:0 10px;font-size:16px}
header nav.sub{padding-left:16px!important;padding-right:16px!important}
header nav.sub a{flex:0 0 auto}
}
</style>
<script src="js/dc.js" defer></script>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding: 32px; font: 18px system-ui">Esta página necesita JavaScript. Los datos completos están en <a href="data/obras.json">data/obras.json</a>.</p></noscript>
<template id="vista">
<div style="min-height: 100vh">
<div class="prog" aria-hidden="true"></div>
<header style="position: sticky; top: 0; z-index: 40; background: rgba(227, 228, 225, 0.93); backdrop-filter: blur(8px); border-bottom: 1.5px solid #1f2326">
  <div style="max-width: 1280px; margin: 0 auto; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 32px">
    <a href="index.html" class="brand"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="17" rx="1.5" fill="#17457a"></rect><path d="M9 22v7M23 22v7" stroke="#1f2326" stroke-width="2.2"></path><path d="M8 13h16" stroke="#f4f5f3" stroke-width="2.2"></path></svg>Obra Parada</a>
    <nav class="nav" aria-label="Secciones" style="display: flex; flex-wrap: wrap; margin-left: auto">
      <a href="index.html">Inicio</a>
      <a href="mapa.html">Mapa</a>
      <a href="analisis.html">Análisis</a>
      <a href="comparar.html" class="on" aria-current="page">Comparar</a>
      <a href="control.html">Servicios de control</a>
      <a href="metodo.html">Cómo se hizo</a>
      <a href="explorador.html">Explorador</a>
    </nav>
  </div>
</header>

<section style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 24px">
  <p style="margin: 0 0 8px; font: 600 18px 'Barlow Condensed', sans-serif; color: #8a5a00">04 · COMPARAR</p>
  <h1 style="margin: 0 0 12px; font: 800 clamp(44px, 5.4vw, 76px)/0.95 'Barlow Condensed', sans-serif">Dos departamentos, cara a cara</h1>
  <p style="margin: 0 0 20px; max-width: 64ch; font-size: 19px; color: #343a3e">{{resumen}}</p>
  <button type="button" class="dice" onClick="{{random}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"></rect><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"></circle><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"></circle><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"></circle><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"></circle></svg>Duelo al azar</button>
</section>

<section style="max-width: 1280px; margin: 0 auto; padding: 16px 32px 32px">
  <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 20px; align-items: end">
    <label style="display: block"><span style="display: block; font-size: 14px; font-weight: 600; color: #17457a; margin-bottom: 6px">Departamento A</span>
      <select class="sel" value="{{a}}" onChange="{{setA}}" style="border-color: #17457a">
        <template sc-for list="{{opts}}" as="o" hint-placeholder-count="25"><option value="{{o.u}}">{{o.n}}</option></template>
      </select>
    </label>
    <button type="button" class="swap" onClick="{{swap}}" aria-label="Intercambiar departamentos"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3"></path></svg></button>
    <label style="display: block"><span style="display: block; font-size: 14px; font-weight: 600; color: #8a5a00; margin-bottom: 6px">Departamento B</span>
      <select class="sel" value="{{b}}" onChange="{{setB}}" style="border-color: #8a5a00">
        <template sc-for list="{{opts}}" as="o" hint-placeholder-count="25"><option value="{{o.u}}">{{o.n}}</option></template>
      </select>
    </label>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 24px; margin-top: 32px">
    <div style="text-align: center">
      <div class="{{waveA}}" style="position: relative; width: min(100%, 360px); margin: 0 auto; aspect-ratio: 420 / 615; cursor: pointer" onMouseMove="{{moveA}}" onMouseLeave="{{leaveA}}" onClick="{{clickA}}" role="img" aria-label="{{ariaA}}">
        <template sc-for list="{{dotsA}}" as="g" hint-placeholder-count="200">
          <span class="{{g.cls}}" style="left: {{g.l}}%; top: {{g.t}}%; animation-delay: {{g.d}}ms"></span>
        </template>
      </div>
      <p style="margin: 12px 0 0; font: 800 40px/1 'Barlow Condensed', sans-serif; color: #17457a">{{nameA}}</p>
      <p style="margin: 4px 0 0; font-size: 14px; color: #5d6468; min-height: 20px">{{hintA}}</p>
    </div>
    <div style="align-self: center; text-align: center" aria-hidden="true"><span class="{{vsCls}}" style="display: inline-block">VS</span></div>
    <div style="text-align: center">
      <div class="{{waveB}}" style="position: relative; width: min(100%, 360px); margin: 0 auto; aspect-ratio: 420 / 615; cursor: pointer" onMouseMove="{{moveB}}" onMouseLeave="{{leaveB}}" onClick="{{clickB}}" role="img" aria-label="{{ariaB}}">
        <template sc-for list="{{dotsB}}" as="g" hint-placeholder-count="200">
          <span class="{{g.cls}}" style="left: {{g.l}}%; top: {{g.t}}%; animation-delay: {{g.d}}ms"></span>
        </template>
      </div>
      <p style="margin: 12px 0 0; font: 800 40px/1 'Barlow Condensed', sans-serif; color: #8a5a00">{{nameB}}</p>
      <p style="margin: 4px 0 0; font-size: 14px; color: #5d6468; min-height: 20px">{{hintB}}</p>
    </div>
  </div>
</section>

<section style="max-width: 1280px; margin: 0 auto; padding: 32px 32px 48px">
  <p style="margin: 0 0 8px; font: 600 18px 'Barlow Condensed', sans-serif; color: #8a5a00">OBRA POR OBRA</p>
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 16px">
    <div>
      <h2 style="margin: 0 0 8px; font: 800 clamp(32px, 3.6vw, 48px)/1 'Barlow Condensed', sans-serif">Cada punto es una obra</h2>
      <p style="margin: 0; color: #5d6468; max-width: 60ch">Cambia de vista y mira cómo los puntos se reordenan. Pasa el cursor por uno para ver la obra; haz clic para abrir su ficha.</p>
    </div>
    <div class="otabs" role="tablist" aria-label="Cómo ordenar los puntos">
      <template sc-for list="{{oModes}}" as="m" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{m.sel}}" class="{{m.cls}}" onClick="{{m.pick}}">{{m.l}}</button></template>
    </div>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 10px; font-size: 14px">
    <span style="display: inline-flex; align-items: center; gap: 8px"><i style="width: 12px; height: 12px; border-radius: 50%; background: #17457a"></i>{{nameA}} · {{oCountA}}</span>
    <span style="display: inline-flex; align-items: center; gap: 8px"><i style="width: 12px; height: 12px; border-radius: 50%; background: #e9a21a"></i>{{nameB}} · {{oCountB}}</span>
    <span style="color: #5d6468">{{oSub}}</span>
  </div>
  <div class="ostage" id="ostage" onMouseMove="{{oMove}}" onMouseLeave="{{oLeave}}" onClick="{{oClick}}">
    <template sc-if value="{{oLoading}}" hint-placeholder-val="{{false}}"><p style="position: absolute; inset: 0; display: grid; place-items: center; margin: 0; color: #5d6468; font: 600 20px 'Barlow Condensed', sans-serif">Cargando las obras…</p></template>
    <template sc-for list="{{oBg}}" as="g" hint-placeholder-count="0">
      <span class="obg" style="left: calc(50% + {{g.x}}px); top: {{g.y}}px; opacity: {{g.o}}"></span>
    </template>
    <template sc-for list="{{oLabels}}" as="l" hint-placeholder-count="6">
      <span class="olab" style="left: calc({{l.p}}% + {{l.x}}px); top: {{l.y}}px; transform: translateX({{l.tx}}%); font: {{l.f}}; color: {{l.c}}">{{l.t}}</span>
    </template>
    <template sc-for list="{{oDots}}" as="d" hint-placeholder-count="120">
      <span class="{{d.cls}}" style="left: calc({{d.p}}% + {{d.x}}px); top: {{d.y}}px; width: {{d.s}}px; height: {{d.s}}px; background: {{d.c}}; transition-delay: {{d.dl}}ms"></span>
    </template>
    <template sc-if value="{{oTipOn}}" hint-placeholder-val="{{false}}">
      <div class="otip" style="left: calc({{oTip.p}}% + {{oTip.x}}px); top: {{oTip.y}}px; transform: translate({{oTip.tx}}, -50%)">
        <b style="display: block; font: 700 17px/1.15 'Barlow Condensed', sans-serif">{{oTip.n}}</b>
        <span style="display: block; color: #b9c2c8; font-size: 13px; margin: 2px 0 8px">{{oTip.l}}</span>
        <span style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px">Falta ejecutar <strong style="font: 700 18px 'Barlow Condensed', sans-serif">{{oTip.s}}</strong></span>
        <span style="display: block; height: 4px; background: rgba(255, 255, 255, 0.15); margin: 6px 0 4px"><i style="display: block; height: 100%; width: {{oTip.w}}%; background: #e9a21a"></i></span>
        <span style="display: block; font-size: 12.5px; color: #c9d1d6">{{oTip.a}}</span>
      </div>
    </template>
  </div>
  <template sc-if value="{{oFichaOn}}" hint-placeholder-val="{{false}}">
    <div class="ofi" aria-live="polite">
      <span class="bolt" style="top: 10px; left: 10px"></span><span class="bolt" style="top: 10px; right: 10px"></span><span class="bolt" style="bottom: 10px; left: 10px"></span><span class="bolt" style="bottom: 10px; right: 10px"></span>
      <div style="display: flex; justify-content: space-between; gap: 16px; align-items: flex-start">
        <p style="margin: 0; font-size: 14px; color: #c9d6e6">{{oFicha.k}}</p>
        <button type="button" onClick="{{oClose}}" aria-label="Cerrar ficha" style="all: unset; cursor: pointer; font-size: 28px; line-height: 1; color: #fff; padding: 0 6px">×</button>
      </div>
      <dl style="margin: 10px 0 0; display: grid; gap: 0">
        <div class="ofr"><dt>OBRA</dt><dd style="font: 800 26px/1.1 'Barlow Condensed', sans-serif">{{oFicha.n}}</dd></div>
        <div class="ofr"><dt>UBICACIÓN</dt><dd>{{oFicha.l}}</dd></div>
        <div class="ofr"><dt>FALTA EJECUTAR</dt><dd>{{oFicha.s}}</dd></div>
        <div class="ofr"><dt>AVANCE FÍSICO</dt><dd>{{oFicha.a}}<span style="display: block; height: 8px; background: rgba(255, 255, 255, 0.25); margin-top: 6px"><i style="display: block; height: 100%; width: {{oFicha.w}}%; background: #e9a21a"></i></span></dd></div>
        <div class="ofr"><dt>CAUSA</dt><dd>{{oFicha.c}}</dd></div>
        <div class="ofr"><dt>AÑO DE INICIO</dt><dd>{{oFicha.i}}</dd></div>
      </dl>
    </div>
  </template>
</section>

<section style="max-width: 1280px; margin: 0 auto; padding: 24px 32px 56px">
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px">
    <h2 style="margin: 0; font: 800 clamp(32px, 3.6vw, 48px)/1 'Barlow Condensed', sans-serif">La balanza</h2>

<script type="text/x-dc" id="logica">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { a: '21', b: '08', fa: false, fb: false, bm: 'saldo', ver: 0, gha: null, ghb: null, ax: null, pt: 0, pseg: null, hy: null, obr: null, om: 'mapa', oh: null, os: null, sw: 1216 };
  }
  componentDidMount() {
    fetch('data/obras_por_depto.json').then((r) => r.json()).then((obr) => this.setState({ obr })).catch(() => this.setState({ obr: {} }));
    this.measure = () => {
      const el = document.getElementById('ostage');
      if (el && Math.abs(el.clientWidth - this.state.sw) > 4) this.setState({ sw: el.clientWidth });
    };
    this.measure();
    window.addEventListener('resize', this.measure);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.measure); }
  // Posición de cada punto en la vista elegida: { p: % horizontal, x: px desde ahí, y: px desde arriba }.
  oLayout(sides) {
    const st = this.state, H = 580;
    const k = Math.max(0.55, Math.min(1, st.sw / 1216));
    const step = 7 * k, mode = st.om;
    const pos = [], labels = [];
    const CAUS = ['Incumplimiento de contrato', 'Falta de recursos', 'Arbitraje y controversias', 'Expediente técnico deficiente', 'Abandono de obra', 'Otras causas'];
    const lab = (p, x, y, t, f, c, tx) => labels.push({ p, x: x.toFixed(1), y: y.toFixed(1), t, f: f || "600 14px 'Barlow Condensed', sans-serif", c: c || '#5d6468', tx: tx == null ? -50 : tx });
    if (mode === 'mapa') {
      const km = (H - 40) / 615;
      sides.forEach(({ list }) => list.forEach((o) => pos.push({ p: 50, x: (o[0] - 210) * km, y: 20 + o[1] * km })));
      return { pos, labels, km };
    }
    sides.forEach(({ list, name, color, center }, si) => {
      lab(center, 0, 14, name, "800 26px 'Barlow Condensed', sans-serif", si ? '#8a5a00' : '#17457a');
      if (mode === 'avance' || mode === 'anio') {
        const nb = 20, per = mode === 'avance' ? 3 : 2, colW = per * step + 4 * k;
        const bins = Array.from({ length: nb }, () => 0);
        const base = H - 50;
        list.forEach((o) => {
          let b;
          if (mode === 'avance') b = o[2] < 0 ? 0 : Math.min(19, Math.floor(o[2] / 5));
          else b = Math.max(0, Math.min(19, (o[4] || 21) - 7));
          const n = bins[b]++;
          pos.push({ p: center, x: (b - nb / 2) * colW + (n % per) * step + step / 2, y: base - Math.floor(n / per) * step });
        });
        const ticks = mode === 'avance' ? [[0, '0%'], [10, '50%'], [19, '95%+']] : [[0, '2007'], [5, '2012'], [10, '2017'], [15, '2022'], [19, '2026']];
        ticks.forEach(([b, t]) => lab(center, (b - nb / 2) * colW + (per * step) / 2, base + 14, t, "500 12.5px 'Barlow', sans-serif"));
        lab(center, 0, H - 18, mode === 'avance' ? 'avance físico →' : 'año de inicio →', "500 12.5px 'Barlow', sans-serif", '#8d9396');
      } else {
        // causa: filas, alineadas entre los dos lados
        const perLine = Math.max(20, Math.floor(260 / 7)), left = -130 * k * 2;
        const counts = sides.map((s) => CAUS.map((c, ci) => s.list.filter((o) => o[3] === ci).length));
        let y = 60;
        const rowY = CAUS.map((c, ci) => {
          const lines = Math.max(1, ...counts.map((cc) => Math.ceil(cc[ci] / perLine)));
          const yy = y; y += 22 + lines * step + 10 * k; return yy;
        });
        const seen = CAUS.map(() => 0);
        list.forEach((o) => {
          const ci = o[3], n = seen[ci]++;
          pos.push({ p: center, x: left + (n % perLine) * step + step / 2, y: rowY[ci] + 22 + Math.floor(n / perLine) * step });
        });
        CAUS.forEach((c, ci) => lab(center, left, rowY[ci], `${c} · ${counts[si][ci]}`, null, '#343a3e', 0));
      }
    });
    return { pos, labels, k };
  }
  oVals(A, B, nf, nf1, M) {
    const st = this.state;
    const obr = st.obr;
    const MODES = [['mapa', 'Mapa'], ['avance', 'Avance'], ['causa', 'Causa'], ['anio', 'Año de inicio']];
    const CAUS = ['Incumplimiento de contrato', 'Falta de recursos financieros y liquidez', 'Discrepancias, controversias y arbitraje', 'Deficiencia en el expediente técnico', 'Abandono de obra', 'Otra causa'];
    const NIV = { L: 'Gobierno local', R: 'Gobierno regional', N: 'Gobierno nacional' };
    const la = (obr && obr[A[0]]) || [], lb = (obr && obr[B[0]]) || [];
    const sides = [{ list: la, name: A[1], color: '#17457a', center: 25 }, { list: lb, name: B[1], color: '#e9a21a', center: 75 }];
    const { pos, labels } = this.oLayout(sides);
    const all = [...la.map((o) => [o, 'a']), ...lb.map((o) => [o, 'b'])];
    const sz = Math.max(4, 6 * Math.max(0.55, Math.min(1, st.sw / 1216)));
    const oDots = all.map(([o, s], i) => ({
      p: pos[i].p, x: pos[i].x.toFixed(1), y: pos[i].y.toFixed(1), s: sz,
      c: s === 'a' ? '#17457a' : '#e9a21a',
      cls: i === st.os ? 'od sel' : i === st.oh ? 'od hv' : 'od', dl: (i % 70) * 7,
    }));
    // trama gris del Perú solo en la vista de mapa
    const km = 540 / 615;
    const oBg = st.om === 'mapa' ? this.GRID().cells.map(([x, y]) => ({ x: (((x - 0.5) * 9) - 210) * km, y: (20 + ((y - 0.5) * 9) * km).toFixed(1), o: 1 })) : [];
    const info = (i) => {
      const [o, s] = all[i];
      const d = s === 'a' ? A : B;
      return {
        n: o[6], l: `${o[7] ? o[7] + ', ' : ''}${d[1]} · ${NIV[o[8]]}`, s: M(o[5]), w: Math.max(0, o[2]),
        a: `${o[2] < 0 ? 'Avance sin dato' : o[2] + '% construida'} · ${CAUS[o[3]]}`, c: CAUS[o[3]], i: o[4] ? 2000 + o[4] : 'Sin dato',
        k: `${d[1]} · ${NIV[o[8]]}`,
      };
    };
    const hit = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      let best = null, bd = 1e9;
      pos.forEach((q, i) => {
        const d = Math.hypot((q.p / 100) * r.width + q.x - mx, q.y - my);
        if (d < bd) { bd = d; best = i; }
      });
      return bd <= 7 ? best : null;
    };
    const tip = st.oh != null && all[st.oh] ? (() => {
      const q = pos[st.oh], t = info(st.oh);
      const right = q.p > 50 || (q.p === 50 && q.x > 0);
      return { ...t, p: q.p, x: (q.x + (right ? -14 : 14)).toFixed(1), y: Math.min(520, Math.max(70, q.y)).toFixed(1), tx: right ? '-100%' : '0' };
    })() : null;
    const ficha = st.os != null && all[st.os] ? info(st.os) : null;
    return {
      oModes: MODES.map(([k, l]) => ({ l, cls: st.om === k ? 'on' : '', sel: String(st.om === k), pick: () => this.setState({ om: k, oh: null }) })),
      oCountA: `${nf.format(la.length)} obras`, oCountB: `${nf.format(lb.length)} obras`,
      oSub: { mapa: 'Ubicadas en su distrito.', avance: 'Agrupadas por avance físico, de 5 en 5 %.', causa: 'Una fila por causa, de más a menos dinero pendiente.', anio: 'Según el año en que empezaron.' }[st.om],
      oLoading: !obr, oBg, oLabels: labels, oDots,
      oMove: (e) => { const i = hit(e); if (i !== this.state.oh) this.setState({ oh: i }); },
      oLeave: () => this.setState({ oh: null }),
      oClick: (e) => { const i = hit(e); this.setState({ os: i }); },
      oTipOn: Boolean(tip), oTip: tip || { p: 0, x: 0, y: 0, tx: '0', n: '', l: '', s: '', w: 0, a: '' },
      oFichaOn: Boolean(ficha), oFicha: ficha || { k: '', n: '', l: '', s: '', a: '', w: 0, c: '', i: '' },
      oClose: () => this.setState({ os: null }),
    };
  }
  GRID() {

  extraVals(A, B, DEP, M, nf, nf1) {
    const st = this.state;

    const byU = Object.fromEntries(DEP.map((d) => [d[0], d]));

    // ----- los dos mapas de puntos -----
    const dots = (u, gh, on) => {
      const c = cen[u];

        l: (((x - 0.5) * 9) / 420 * 100).toFixed(2), t: (((y - 0.5) * 9) / 615 * 100).toFixed(2),
        cls: k === u ? `cd ${on}` : k === gh ? 'cd hv' : 'cd',

      const r = e.currentTarget.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * 420, y = ((e.clientY - r.top) / r.height) * 615;
      return at[`${Math.round(x / 9 + 0.5)},${Math.round(y / 9 + 0.5)}`] || null;
    };

      ['Obras', (d) => d[2], (v) => nf.format(v)],

      ['Costo', (d) => d[4], M],
      ['Avance mediano', (d) => d[5], (v) => `${nf1.format(v)}%`],
