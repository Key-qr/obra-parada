<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obra Parada · Inicio</title>
<meta name="description" content="Las 2,262 obras públicas paralizadas en el Perú según la Contraloría: simulador de presupuesto, la ciudad de las obras y el país hecho de puntos.">
<meta property="og:title" content="Obra Parada · Inicio">
<meta property="og:description" content="Las 2,262 obras públicas paralizadas en el Perú según la Contraloría: simulador de presupuesto, la ciudad de las obras y el país hecho de puntos.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="vendor/fonts.css" rel="stylesheet">
<style>
body{margin:0;background:#e3e4e1;color:#1f2326;font-family:'Barlow',system-ui,sans-serif;overflow-x:clip}
a{color:#17457a}a:hover{color:#0f3359}
*{box-sizing:border-box}
.prog{position:fixed;top:0;left:0;right:0;height:4px;background:#e9a21a;transform-origin:0 50%;transform:scaleX(0);z-index:60}
@supports (animation-timeline: scroll()){.prog{animation:prog linear both;animation-timeline:scroll(root)}}
@keyframes prog{to{transform:scaleX(1)}}
.brand{display:inline-flex;align-items:center;gap:10px;font:800 24px/1 'Barlow Condensed',sans-serif;color:#1f2326;text-decoration:none}
.brand:hover{color:#1f2326}
.brand svg rect{transition:transform .4s cubic-bezier(.2,.9,.3,1.4);transform-origin:50% 100%}
.brand:hover svg rect{transform:rotate(-8deg)}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font:600 18px/1 'Barlow Condensed',sans-serif;color:#1f2326;text-decoration:none}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:3px;background:#e9a21a;transform:scaleX(0);transform-origin:0 50%;transition:transform .25s ease}
.nav a:hover::after{transform:scaleX(1)}
.nav a.on{background:#1f2326;color:#fff}
.nav a.on::after{display:none}
.tape{height:14px;background:repeating-linear-gradient(45deg,#e9a21a 0 10px,#1f2326 10px 20px);background-size:28.28px 14px;animation:tape 1.4s linear infinite}
@keyframes tape{to{background-position:28.28px 0}}
.word{display:inline-block;animation:sube .7s cubic-bezier(.2,.8,.2,1) backwards;transition:color .2s,transform .3s cubic-bezier(.2,.9,.3,1.5);cursor:default}
.word:hover{color:#e9a21a !important;transform:translateY(-10px) rotate(-3deg)}
.sky{position:relative;height:410px}
.sky::after{content:"";position:absolute;left:0;right:0;bottom:30px;height:2px;background:#1f2326}
.city{position:absolute;left:4px;right:4px;top:0;bottom:32px;z-index:1}
.bd{position:absolute;bottom:0;width:calc(4% - 2px);padding:0;border:0;border-radius:4px 4px 0 0;background:transparent;cursor:pointer;transition:left .8s cubic-bezier(.65,0,.25,1),height .8s cubic-bezier(.65,0,.25,1),background-color .2s}
.bd:hover,.bd.hv{background:rgba(31,35,38,.08)}
.bd.sel{background:rgba(23,69,122,.12)}
.bd:focus-visible{outline:3px solid #17457a;outline-offset:2px}
.bd.hit::after{content:"";position:absolute;left:50%;top:-20px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#e9a21a;box-shadow:0 0 0 3px #e3e4e1,0 0 0 4.5px #8a5a00;animation:latido .8s ease-in-out infinite alternate}
@keyframes latido{to{transform:scale(1.4)}}
.dt{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;transition:background-color .35s ease,scale .45s cubic-bezier(.2,.9,.3,1.4)}
.blab{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font:600 11px 'Barlow Condensed',sans-serif;color:#5d6468;white-space:nowrap}
.bd.sel .blab,.bd.hv .blab{color:#17457a;font-weight:800}
.crane{position:absolute;margin-left:-22px;z-index:2;pointer-events:none;transition:left .8s cubic-bezier(.65,0,.25,1),bottom .8s cubic-bezier(.65,0,.25,1)}
.crane .jib{transform-origin:22px 11px;animation:gira 3.4s ease-in-out infinite alternate}
@keyframes gira{to{transform:scaleX(-.55)}}
.crane .hook{animation:cuelga 2.2s ease-in-out infinite alternate}
@keyframes cuelga{to{transform:translateY(9px)}}
.skread{position:absolute;right:6px;top:6px;z-index:3;width:270px;max-width:62%;text-align:right;color:#1f2326;pointer-events:none}
.skread-a{animation:infoA .25s ease-out}.skread-b{animation:infoB .25s ease-out}
.skhint{position:absolute;left:0;right:0;top:44%;z-index:4;text-align:center;font:700 20px 'Barlow Condensed',sans-serif;color:#17457a;pointer-events:none;opacity:0}
@supports (animation-timeline: scroll()){
.dt{animation:junta linear both;animation-timeline:scroll(root);animation-range:0px var(--ar,420px)}
.crane{animation:craneIn linear both;animation-timeline:scroll(root);animation-range:330px 470px}
.skhint{animation:hintOut linear both;animation-timeline:scroll(root);animation-range:0px 180px}
}
@keyframes junta{0%{translate:var(--sx,0px) var(--sy,-60px);opacity:.5}100%{translate:0 0;opacity:1}}
@keyframes craneIn{from{opacity:0;translate:0 -40px}}
@keyframes hintOut{from{opacity:1}to{opacity:0}}
.wq{flex:1 1 200px;min-width:0;min-height:44px;padding:0 14px;border:1.5px solid #1f2326;border-radius:0;background:#f4f5f3;color:#1f2326;font:500 16px 'Barlow',sans-serif}
.wq:focus-visible{outline:3px solid #17457a;outline-offset:2px}
.skrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-top:1px solid #b9bdbb;animation:infoA .3s ease-out backwards}
.hasta{min-height:36px;padding:0 12px;border:1.5px solid #17457a;background:#f4f5f3;color:#17457a;font:600 15px 'Barlow Condensed',sans-serif;cursor:pointer;white-space:nowrap}
.hasta:hover{background:#17457a;color:#fff}
.hasta:focus-visible{outline:3px solid #e9a21a;outline-offset:2px}
@keyframes sube{from{opacity:0;transform:translateY(60%) rotate(4deg)}}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;font:600 19px/1 'Barlow Condensed',sans-serif;text-decoration:none;border:1.5px solid #1f2326;color:#1f2326;background:#f4f5f3;cursor:pointer;transition:transform .15s,background-color .15s,color .15s}
.btn:hover{background:#1f2326;color:#fff;transform:translateY(-2px)}
.btn.solid{background:#17457a;border-color:#17457a;color:#fff}
.btn.solid:hover{background:#0f3359;border-color:#0f3359}
.btn svg{transition:transform .2s}
.btn:hover svg{transform:translateX(4px)}
.sim{background:#1f2326;color:#fff;padding:28px;border-left:6px solid #e9a21a;position:relative;overflow:hidden}
.range{-webkit-appearance:none;appearance:none;width:100%;height:12px;background:repeating-linear-gradient(45deg,#e9a21a 0 8px,#3a4044 8px 16px);border-radius:0;outline:none;cursor:pointer}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid #e9a21a;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .15s}
.range::-webkit-slider-thumb:hover{transform:scale(1.15)}
.range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid #e9a21a}
.range:focus-visible{outline:3px solid #fff;outline-offset:4px}
.pre{min-height:40px;padding:0 12px;border:1.5px solid #5d6468;background:transparent;color:#fff;font:600 15px 'Barlow Condensed',sans-serif;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s}
.pre:hover{border-color:#e9a21a}
.pre.on{background:#e9a21a;border-color:#e9a21a;color:#1f2326}
.play{width:48px;height:48px;border-radius:50%;border:0;background:#e9a21a;color:#1f2326;display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.play:hover{transform:scale(1.1)}
.marq{display:flex;width:max-content;animation:marq 60s linear infinite}
.marq-wrap:hover .marq{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.chap{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,340px) 60px;gap:24px;align-items:center;padding:32px 0;border-top:2px solid #1f2326;text-decoration:none;color:#1f2326;transition:padding .3s,background-color .3s}
.chap:hover{color:#1f2326;padding-left:20px;background:#f4f5f3}
.chap .arr{width:52px;height:52px;border-radius:50%;border:1.5px solid #1f2326;display:grid;place-items:center;transition:transform .3s,background-color .3s}
.chap:hover .arr{transform:rotate(-45deg);background:#e9a21a;border-color:#e9a21a}
.chap .num{font:800 64px/1 'Barlow Condensed',sans-serif;color:transparent;-webkit-text-stroke:1.5px #1f2326;transition:color .3s}
.chap:hover .num{color:#17457a;-webkit-text-stroke-color:#17457a}
.pts{position:relative;width:100%;aspect-ratio:420/615;cursor:crosshair}
.gd{position:absolute;width:1.6%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);transition:transform .25s cubic-bezier(.2,.9,.3,1.6),background-color .35s,opacity .3s;animation:aparece .5s cubic-bezier(.2,.9,.3,1.5) backwards;pointer-events:none}
@keyframes aparece{from{opacity:0;transform:translate(-50%,-50%) scale(0)}}
.go{position:absolute;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #f4f5f3;background:#1f2326;transition:transform .2s,background-color .2s;animation:caeo .6s cubic-bezier(.2,.9,.3,1.4) backwards;pointer-events:none}
@keyframes caeo{from{opacity:0;transform:translate(-50%,-260%) scale(.4)}}
.mt{min-height:44px;padding:0 16px;font:600 16px 'Barlow Condensed',sans-serif;border:1.5px solid #1f2326;background:#f4f5f3;color:#1f2326;cursor:pointer;margin-left:-1.5px;transition:background-color .2s,color .2s}
.mt.on{background:#1f2326;color:#fff}
.info{background:#1f2326;color:#fff;padding:24px;border-left:6px solid #e9a21a;min-height:230px}
.info-a{animation:infoA .3s ease-out}
.info-b{animation:infoB .3s ease-out}
@keyframes infoA{from{opacity:.2;transform:translateY(6px)}}
@keyframes infoB{from{opacity:.2;transform:translateY(6px)}}
@supports (animation-timeline: view()){
.rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
.rvl{animation:rvl linear both;animation-timeline:view();animation-range:entry 0% cover 35%}
.rvr{animation:rvr linear both;animation-timeline:view();animation-range:entry 0% cover 35%}
}
@keyframes rv{from{opacity:0;transform:translateY(48px)}}
@keyframes rvl{from{opacity:0;transform:translateX(-120px)}}
@keyframes rvr{from{opacity:0;transform:translateX(120px)}}
@media (max-width:760px){.chap{grid-template-columns:56px minmax(0,1fr) 48px}.chap .mini{display:none}.chap .num{font-size:44px}.blab{display:none}}
@media (max-width:760px){
header .nav,header nav.sub{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
header .nav{margin-left:0!important;width:100%}
header .nav::-webkit-scrollbar,header nav.sub::-webkit-scrollbar{display:none}
header .nav a{flex:0 0 auto;min-height:40px;padding:0 10px;font-size:16px}
header nav.sub{padding-left:16px!important;padding-right:16px!important}
header nav.sub a{flex:0 0 auto}
}
</style>
<script src="js/dc.js" defer></script>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding: 32px; font: 18px system-ui">Esta página necesita JavaScript. Los datos completos están en <a href="data/obras.json">data/obras.json</a>.</p></noscript>
<template id="vista">
<div style="min-height: 100vh">
<div class="prog" aria-hidden="true"></div>

<header style="position: sticky; top: 0; z-index: 40; background: rgba(227, 228, 225, 0.93); backdrop-filter: blur(8px); border-bottom: 1.5px solid #1f2326">
  <div style="max-width: 1280px; margin: 0 auto; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 32px">
    <a href="index.html" class="brand"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="17" rx="1.5" fill="#17457a"></rect><path d="M9 22v7M23 22v7" stroke="#1f2326" stroke-width="2.2"></path><path d="M8 13h16" stroke="#f4f5f3" stroke-width="2.2"></path></svg>Obra Parada</a>
    <nav class="nav" aria-label="Secciones" style="display: flex; flex-wrap: wrap; margin-left: auto">
      <a href="index.html" class="on" aria-current="page">Inicio</a>
      <a href="mapa.html">Mapa</a>
      <a href="analisis.html">Análisis</a>
      <a href="comparar.html">Comparar</a>
      <a href="control.html">Servicios de control</a>
      <a href="metodo.html">Cómo se hizo</a>
      <a href="explorador.html">Explorador</a>
    </nav>
  </div>
</header>

<section style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 56px; overflow-x: clip">
  <p style="margin: 0 0 16px; font: 600 18px 'Barlow Condensed', sans-serif; color: #8a5a00; letter-spacing: 0.04em">CONTRALORÍA GENERAL · INFORME A JUNIO DE 2026</p>
  <h1 style="margin: 0 0 18px; font: 800 clamp(48px, 6.4vw, 92px)/0.92 'Barlow Condensed', sans-serif; letter-spacing: -0.01em; max-width: 15ch">
    <span class="word" style="animation-delay: 0ms; font-variant-numeric: tabular-nums">{{h1n}}</span> <span class="word" style="animation-delay: 80ms">obras</span> <span class="word" style="animation-delay: 160ms">públicas</span> <span class="word" style="animation-delay: 240ms; color: #17457a">paradas</span> <span class="word" style="animation-delay: 320ms">en</span> <span class="word" style="animation-delay: 400ms">el</span> <span class="word" style="animation-delay: 480ms">Perú.</span>
  </h1>
  <p style="margin: 0 0 36px; font: 600 clamp(22px, 2.4vw, 30px)/1.2 'Barlow Condensed', sans-serif; color: #343a3e">Para terminarlas faltan <span style="color: #17457a; font-weight: 800; font-variant-numeric: tabular-nums">{{saldoTxt}}</span>. ¿Cuántas se podrían terminar con menos?</p>

  <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: stretch">
    <div class="sim" style="flex: 1 1 380px; min-width: 0; align-self: flex-start">
      <p style="margin: 0 0 4px; font: 600 16px 'Barlow Condensed', sans-serif; color: #e9a21a; letter-spacing: 0.06em">SIMULADOR</p>
      <p style="margin: 0 0 20px; color: #c9d1d6">Mueve el presupuesto. Las obras se terminan empezando por las que menos les falta.</p>
      <label for="presu" style="display: block; font-size: 14px; color: #b9c2c8">Presupuesto disponible</label>
      <p style="margin: 2px 0 14px; font: 800 clamp(40px, 4.4vw, 60px)/1 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums">{{budgetTxt}}</p>
      <div style="display: flex; gap: 14px; align-items: center">
        <button type="button" class="play" onClick="{{togglePlay}}" aria-label="{{playLabel}}">
          <template sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg></template>
          <template sc-if value="{{notPlaying}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></template>
        </button>
        <input id="presu" class="range" type="range" min="0" max="20" step="1" value="{{step}}" onInput="{{onRange}}" aria-valuetext="{{budgetTxt}}">
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px" role="group" aria-label="Montos de referencia">
        <template sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
          <button type="button" class="{{p.cls}}" onClick="{{p.pick}}">{{p.label}}</button>
        </template>
      </div>
      <div style="margin-top: 28px; padding-top: 22px; border-top: 1px solid #3a4044">
        <p style="margin: 0; font: 800 clamp(56px, 6vw, 84px)/0.9 'Barlow Condensed', sans-serif; color: #e9a21a; font-variant-numeric: tabular-nums">{{finTxt}}</p>
        <p style="margin: 8px 0 0; font: 600 22px/1.2 'Barlow Condensed', sans-serif">{{finLine}}</p>
        <div style="height: 10px; background: #3a4044; margin-top: 16px" aria-hidden="true"><div style="height: 100%; width: {{finPct}}%; background: #e9a21a; transition: width .7s cubic-bezier(.2,.8,.2,1)"></div></div>
        <p style="margin: 10px 0 0; font-size: 14px; color: #b9c2c8">{{finNote}}</p>
      </div>
    </div>

    <div style="flex: 1.5 1 560px; min-width: 0; display: flex; flex-direction: column">
      <div style="display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 16px; margin-bottom: 12px">
        <div>
          <p style="margin: 0; font: 600 16px 'Barlow Condensed', sans-serif; color: #8a5a00; letter-spacing: 0.06em">LA CIUDAD DE LAS OBRAS PARADAS</p>
          <p style="margin: 2px 0 0; font: 800 26px/1 'Barlow Condensed', sans-serif"><span style="color: #8a5a00; font-variant-numeric: tabular-nums">{{skLitTxt}}</span> obras encendidas de 2,262</p>
        </div>
        <div style="display: flex" role="group" aria-label="Altura de los edificios">
          <template sc-for list="{{skModes}}" as="m" hint-placeholder-count="2"><button type="button" class="{{m.cls}}" onClick="{{m.pick}}" aria-pressed="{{m.on}}">{{m.l}}</button></template>
        </div>
      </div>
      <div class="sky" onMouseLeave="{{skLeave}}">
        <p class="skhint" aria-hidden="true">Baja con el scroll: los puntos se juntan y arman la ciudad ↓</p>
        <div class="skread" aria-live="polite">
          <div class="{{skR.cls}}">
            <p style="margin: 0; font-size: 12.5px; color: #5d6468">{{skR.k}}</p>
            <p style="margin: 2px 0 6px; font: 800 30px/1 'Barlow Condensed', sans-serif">{{skR.n}}</p>
            <p style="margin: 0; font: 700 20px/1.1 'Barlow Condensed', sans-serif; color: #8a5a00">{{skR.a}}</p>
            <p style="margin: 4px 0 0; font-size: 13px; color: #343a3e">{{skR.b}}</p>
          </div>
        </div>
        <div class="city">
          <template sc-for list="{{bld}}" as="b" hint-placeholder-count="25">
            <button type="button" class="{{b.cls}}" style="left: {{b.l}}%; height: {{b.h}}px; transition-delay: {{b.dl}}ms, {{b.dl}}ms, 0ms" onMouseEnter="{{b.hov}}" onFocus="{{b.hov}}" onClick="{{b.pick}}" aria-label="{{b.aria}}" aria-pressed="{{b.on}}">
              <template sc-for list="{{b.dots}}" as="t" hint-placeholder-count="20">
                <span class="dt" style="left: calc(50% + {{t.l}}px); bottom: {{t.b}}px; background: {{t.bg}}; scale: {{t.s}}; transition-delay: {{t.d1}}ms, {{t.d2}}ms; --sx: {{t.sx}}px; --sy: {{t.sy}}px; --ar: {{t.ar}}px"></span>
              </template>
              <span class="blab">{{b.ab}}</span>
            </button>
          </template>
          <svg class="crane" width="66" height="64" viewBox="0 0 66 64" style="left: {{cr.l}}%; bottom: {{cr.b}}px" aria-hidden="true">
            <rect x="20" y="10" width="4" height="54" fill="#e9a21a"></rect>
            <path d="M20 62l4-6-4-6 4-6-4-6 4-6-4-6 4-6-4-6" stroke="#8a5a00" stroke-width="1" fill="none"></path>
            <g class="jib">
              <path d="M22 1L6 9M22 1L62 9" stroke="#e9a21a" stroke-width="1.3" fill="none"></path>
              <rect x="4" y="9" width="60" height="4" fill="#e9a21a"></rect>
              <rect x="4" y="13" width="9" height="7" fill="#5d6468"></rect>
              <g class="hook"><line x1="52" y1="13" x2="52" y2="32" stroke="#1f2326" stroke-width="1"></line><rect x="48.5" y="32" width="7" height="5" fill="#1f2326"></rect></g>
            </g>
          </svg>
        </div>
      </div>
      <p style="margin: 10px 0 0; font-size: 13.5px; color: #5d6468">{{skCap}}</p>

      <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 18px; align-items: flex-start">
        <div style="flex: 1 1 220px; min-width: 0; background: #f4f5f3; border: 1.5px solid #1f2326; padding: 16px 18px" aria-live="polite">
          <div class="{{infoCls}}">
            <p style="margin: 0 0 4px; font-size: 13px; color: #5d6468">Departamento elegido</p>
            <p style="margin: 0; font: 800 30px/1 'Barlow Condensed', sans-serif">{{selT.name}}</p>
            <p style="margin: 8px 0 0; font-size: 15px; color: #343a3e">{{selT.line}}</p>
            <div style="height: 8px; background: #d3d5d2; margin-top: 12px"><div style="height: 100%; width: {{selT.w}}%; background: #e9a21a; transition: width .6s"></div></div>
            <p style="margin: 14px 0 0; font-size: 15px; color: #343a3e">{{skMoney.t}}</p>
            <div style="height: 8px; background: #d3d5d2; margin-top: 8px"><div style="height: 100%; width: {{skMoney.w}}%; background: #17457a; transition: width .6s"></div></div>
            <p style="margin: 12px 0 0; font-size: 13px; color: #5d6468">Toca un edificio para cambiar de departamento.</p>
          </div>
        </div>
        <div style="flex: 1.4 1 300px; min-width: 0">
          <label for="wq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar distrito u obra</label>
          <div style="display: flex; gap: 10px; align-items: center">
            <input id="wq" class="wq" type="search" placeholder="Busca tu distrito o una obra" value="{{wq}}" onInput="{{onWq}}" autocomplete="off">
            <span style="flex: 0 0 auto; font: 600 15px 'Barlow Condensed', sans-serif; color: #343a3e" aria-live="polite">{{wqInfo}}</span>

<script type="text/x-dc" id="logica">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { t: 0, step: 12, shown: 0, playing: false, sel: '15', pm: 'saldo', hov: null, ob: true, flipI: false, obr: null, skm: 'obras', hb: null, flipR: false, wq: '' };
  }
  // Las 2,262 obras del Anexo 01 en el mismo orden que usa el simulador (de la más barata a la más cara).
  // Fila del archivo: [x, y, avance (-1 sin dato), causa 0-5, inicio - 2000, falta ejecutar (M), nombre, distrito, nivel]
  WALL(obr) {
    if (this._w && this._w.src === obr) return this._w;
    const { DEPD } = this.PT();
    const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const all = [];
    Object.keys(obr).forEach((u) => (obr[u] || []).forEach((o) => all.push({ o, u, q: norm(`${o[6]} ${o[7]} ${DEPD[u] ? DEPD[u][0] : ''}`) })));
    const sal = (i) => all[i].o[5];
    const saldo = all.map((_, i) => i).sort((a, b) => {
      const x = sal(a), y = sal(b);
      if ((x > 0) !== (y > 0)) return x > 0 ? -1 : 1;
      return x - y || a - b;
    });
    const pos = new Array(all.length), cum = [], byDep = {};
    let s = 0;
    saldo.forEach((id, i) => {
      pos[id] = i; s += Math.max(0, sal(id)); cum[i] = s;
      (byDep[all[id].u] = byDep[all[id].u] || []).push(id);
    });
    this._w = { src: obr, all, saldo, pos, cum, byDep, npos: saldo.filter((id) => sal(id) > 0).length, norm };
    return this._w;
  }
  skyVals(DEPS, S, cur, nf, nf1, M) {
    const st = this.state;
    const { DEPD } = this.PT();
    const Mo = (v) => (v <= 0 ? 'S/ 0' : v < 0.001 ? 'menos de S/ 1 mil' : v < 1 ? `S/ ${nf.format(Math.round(v * 1000))} mil` : v < 100 ? `S/ ${nf1.format(v)} millones` : M(v));
    const obr = st.obr;
    const W = obr && Object.keys(obr).length ? this.WALL(obr) : null;
    const Np = W ? Math.min(W.npos, cur[1]) : 0;
    const spent = {};
    if (W) for (let r = 0; r < Np; r++) { const a = W.all[W.saldo[r]]; spent[a.u] = (spent[a.u] || 0) + a.o[5]; }
    const money = st.skm === 'dinero';
    const qn = W && st.wq.trim().length >= 2 ? W.norm(st.wq.trim()) : '';
    const found = qn ? W.all.map((a, id) => id).filter((id) => W.all[id].q.includes(qn)) : [];
    const hits = new Set(found.map((id) => W.all[id].u));

    // edificios: uno por departamento, altura por obras o por dinero pendiente
    const items = DEPS.map((d, k) => {
      const dd = DEPD[d[0]];
      const sp = spent[d[0]] || 0;
      return { d, k, dd, done: cur[3][k], sp, val: money ? dd[2] : dd[1], frac: money ? (W ? Math.min(1, sp / dd[2]) : 0) : cur[3][k] / dd[1] };
    });
    const order = items.slice().sort((a, b) => b.val - a.val);
    const slot = {};
    order.forEach((it, i) => { slot[it.d[0]] = i; });
    // cada punto vale 5 obras (o S/ 100 millones en la vista de dinero); dos columnas por edificio
    const P = 7;
    const nOf = (it, m) => (m ? Math.max(1, Math.round(it.dd[2] / 100)) : Math.ceil(it.dd[1] / 5));
    const hgt = (it) => Math.ceil(nOf(it, money) / 2) * P;
    const rnd = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
    const bld = items.map((it) => {
      const i = slot[it.d[0]], c = it.d[0];
      const n = nOf(it, money), pool = Math.max(nOf(it, false), nOf(it, true));
      const lit = Math.min(n, money ? (W ? Math.round(it.sp / 100) : 0) : Math.round(it.done / 5));
      const dots = [];
      for (let j = 0; j < pool; j++) {
        dots.push({
          l: (j % 2) * P - P + 0.5, b: Math.floor(j / 2) * P,
          bg: j < lit ? '#e9a21a' : '#5d6468', s: j < n ? 1 : 0,
          d1: 100 + i * 20 + j * 9, d2: j * 6,
          sx: Math.round((rnd(it.k, j) - 0.5) * 760), sy: Math.round((rnd(j, it.k + 7) - 0.78) * 620),
          ar: 260 + Math.round(rnd(it.k + 3, j + 5) * 200),
        });
      }
      return {
        l: (i * 4).toFixed(2), h: Math.max(P, hgt(it)), dl: i * 18, ab: it.d[2], dots,
        cls: `bd${st.sel === c ? ' sel' : ''}${st.hb === c ? ' hv' : ''}${hits.has(c) ? ' hit' : ''}`,
        on: String(st.sel === c),
        aria: `${it.dd[0]}: ${nf.format(it.done)} de ${nf.format(it.dd[1])} obras se terminan con ${M(cur[0])}`,
        hov: () => { if (this.state.hb !== c) this.setState({ hb: c, flipR: !this.state.flipR }); },
        pick: () => this.setState({ sel: c, flipI: !this.state.flipI }),
      };
    });
    const selIt = items.find((it) => it.d[0] === st.sel);
    const rIt = items.find((it) => it.d[0] === (st.hb || st.sel));

    // lista: búsqueda o las próximas en terminarse del departamento elegido
    const row = (id, i) => {
      const a = W.all[id], o = a.o, r = W.pos[id], ok = o[5] > 0, done = ok && r < Np;
      return {
        n: o[6], dl: i * 50,
        k: `${o[7] ? o[7] + ', ' : ''}${(DEPD[a.u] || ['—'])[0]} · ${o[2] < 0 ? 'avance sin dato' : `${o[2]} % construida`}`,
        s: ok ? Mo(o[5]) : 'Sin saldo',
        need: done ? `Se termina con ${M(cur[0])}` : ok ? `Para llegar hasta aquí: ${W.cum[r] >= 100 ? `S/ ${nf.format(Math.round(W.cum[r]))} millones` : Mo(W.cum[r])}` : 'No tiene saldo registrado',
        nc: done ? '#8a5a00' : '#5d6468',
        go: ok && !done,
        use: () => {
          let i2 = S.findIndex((x) => x[0] + 0.05 >= W.cum[r]);
          if (i2 < 0) i2 = S.length - 1;
          this.setState({ playing: false, sel: a.u, flipI: !this.state.flipI });
          this.go(i2);
        },
      };
    };
    let skList = [], skListT = '', skEmptyT = '';
    if (!W) { skEmptyT = obr ? 'No se pudo cargar la lista de obras.' : 'Cargando las 2,262 obras…'; }
    else if (qn) {
      skListT = found.length ? 'Lo que encontré' : '';
      skList = found.slice().sort((x, y) => W.all[y].o[5] - W.all[x].o[5]).slice(0, 6).map(row);
      skEmptyT = found.length ? '' : 'Ninguna obra coincide con esa búsqueda.';
    } else {
      const next = (W.byDep[st.sel] || []).filter((id) => W.pos[id] >= Np && W.all[id].o[5] > 0).slice(0, 5);
      skListT = `Las siguientes que se terminarían en ${selIt.dd[0]}`;
      skList = next.map(row);
      skEmptyT = next.length ? '' : `Con ${M(cur[0])} se terminan todas las obras de ${selIt.dd[0]} que tienen saldo.`;
    }
    const crIt = selIt;
    return {
      skModes: [['obras', 'Altura: obras'], ['dinero', 'Altura: dinero']].map(([k, l]) => ({ l, cls: (st.skm || 'obras') === k ? 'mt on' : 'mt', on: String((st.skm || 'obras') === k), pick: () => this.setState({ skm: k }) })),
      skLitTxt: nf.format(cur[1]),
      bld,
      cr: { l: (slot[crIt.d[0]] * 4 + 2).toFixed(2), b: hgt(crIt) },
      skLeave: () => this.setState({ hb: null }),
      skR: {
        cls: st.flipR ? 'skread-a' : 'skread-b',
        k: st.hb && st.hb !== st.sel ? 'Departamento' : 'Departamento elegido',
        n: rIt.dd[0],
        a: `${nf.format(rIt.done)} de ${nf.format(rIt.dd[1])} obras se terminan`,
        b: W ? `${Mo(rIt.sp)} de ${M(rIt.dd[2])} pendientes` : `${M(rIt.dd[2])} pendientes`,
      },
      skCap: money
        ? 'Cada punto son S/ 100 millones por ejecutar. Los ámbar son la plata que se usaría con el presupuesto elegido: como se empieza por las obras más baratas, suben mucho más lento.'
        : 'Cada edificio es un departamento y cada punto son 5 obras paradas. Se pintan de ámbar las que se terminan con el presupuesto; las que no tienen saldo registrado nunca cambian.',
      skMoney: selIt && W
        ? { t: `${Mo(selIt.sp)} de ${M(selIt.dd[2])} del dinero pendiente se usaría aquí.`, w: Math.min(100, (selIt.sp / selIt.dd[2]) * 100).toFixed(1) }
        : { t: `${M(selIt.dd[2])} pendientes.`, w: 0 },
      wq: st.wq,
      onWq: (e) => this.setState({ wq: e.target.value }),
      wqInfo: qn ? `${nf.format(found.length)} ${found.length === 1 ? 'obra' : 'obras'}` : '',
      skList, skListT, skEmpty: Boolean(skEmptyT), skEmptyT,
    };
  }
  // Datos del mapa de puntos: trama del Perú en celdas de 9 px (tramos "x,y,largo,departamento"),
  // cifras por departamento y las 90 obras con más dinero pendiente.
  PT() {

      l: (o[0] / 420 * 100).toFixed(2), t: (o[1] / 615 * 100).toFixed(2),
      s: (8 + 20 * Math.sqrt(o[4]) / maxS).toFixed(1),
      c: hov && hov.k === 'o' && hov.i === i ? '#ffffff' : (o[5] ?? 0) >= 90 ? '#e9a21a' : '#1f2326',
      k: hov && hov.k === 'o' && hov.i === i ? 1.6 : 1, d: 1300 + i * 18,
    }));
    const tot = Object.values(DEPD).reduce((s, d) => s + pGet(d), 0);
    let info;
    if (hov && hov.k === 'o') {
      const o = OBR[hov.i];
      info = { k: `Obra · ${o[6]}, ${DEPD[o[2]][0]}`, t: o[3], v: M(o[4]), l: 'por ejecutar', w: o[5] ?? 0, wl: o[5] == null ? 'Avance sin dato' : `${nf1.format(o[5])}% de avance físico` };
    } else if (hov && hov.k === 'd') {
      const d = DEPD[hov.d];
      const rk = Object.values(DEPD).sort((a, b) => pGet(b) - pGet(a)).indexOf(d) + 1;
      info = { k: `Departamento · puesto ${rk} de 25 en ${pLabel.toLowerCase()}`, t: d[0], v: pFmt(pGet(d)), l: `${nf.format(d[1])} obras · ${M(d[2])} por ejecutar · ${nf.format(d[3])} controles`, w: Math.round((d[2] / 27548) * 100), wl: `${nf1.format((d[2] / 27548) * 100)}% de todo lo que falta ejecutar en el país` };
    } else {
      info = { k: 'Todo el país', t: 'Perú', v: st.pm === 'ctrl' ? '1.9 por obra' : st.pm === 'obras' ? '2,262 obras' : M(27548), l: 'Pasa el cursor por un punto para ver su departamento o una obra.', w: 100, wl: '25 departamentos' };
    }
    const setHov = (h) => {
      const cur = this.state.hov;
      const same = (!h && !cur) || (h && cur && h.k === cur.k && h.d === cur.d && h.i === cur.i);
      if (!same) this.setState({ hov: h, flipI: !this.state.flipI });
    };
    return {
      pMetrics: Object.keys(PM).map((k) => ({ l: PM[k][0], cls: k === st.pm ? 'mt on' : 'mt', pick: () => this.setState({ pm: k }) })),
      obCls: st.ob ? 'mt on' : 'mt', obOn: String(st.ob), obOnB: st.ob,
      toggleOb: () => this.setState({ ob: !st.ob, hov: null }),
      grid: pgrid, obras, info, infoCls: st.flipI ? 'info-a' : 'info-b',
      ramp: PR.map((c) => ({ c })), rampLbl: pWord,
      ptMove: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const x = ((e.clientX - r.left) / r.width) * 420, y = ((e.clientY - r.top) / r.height) * 615;
        if (st.ob) {
          let best = -1, bd = 1e9;
          OBR.forEach((o, i) => { const dd = Math.hypot(o[0] - x, o[1] - y); if (dd < bd) { bd = dd; best = i; } });
          const rad = ((8 + 20 * Math.sqrt(OBR[best][4]) / maxS) / 2) * (420 / r.width) + 2;
          if (bd <= rad) { setHov({ k: 'o', i: best, d: OBR[best][2] }); return; }
        }
        const u = at[`${Math.round(x / 9 + 0.5)},${Math.round(y / 9 + 0.5)}`];
        setHov(u ? { k: 'd', d: u } : null);
      },
      ptLeave: () => setHov(null),
      saldoTxt: `S/ ${nf.format(Math.round(27548 * ease))} millones`,
      step: st.step,
      onRange: (e) => this.go(Number(e.target.value)),
      budgetTxt: M(cur[0]),
      playing: st.playing, notPlaying: !st.playing,
      playLabel: st.playing ? 'Pausar' : 'Reproducir de cero a todo',
      togglePlay: () => {
        if (st.playing) { this.setState({ playing: false }); return; }
        this.setState({ playing: true });
        if (st.step >= 20) this.go(0);
      },
      presets: PRE.map(([i, label]) => ({ label, cls: st.step === i ? 'pre on' : 'pre', pick: () => { this.setState({ playing: false }); this.go(i); } })),
      finTxt: `${nf.format(st.shown)} obras`,
      finLine: st.step === 0 ? 'Sin presupuesto no se termina ninguna.' : `se terminarían con ${M(cur[0])}`,
      finPct: ((cur[1] / TOTAL) * 100).toFixed(1),
      finNote: `${nf1.format((cur[1] / TOTAL) * 100)}% de las 2,047 obras que tienen saldo pendiente. Hay 215 más sin saldo registrado.`,
      selT: { name: sd[1], line: `${nf.format(cur[3][sk])} de ${nf.format(sd[5])} obras con saldo se terminan con ${M(cur[0])}.`, w: sd[5] ? Math.round((cur[3][sk] / sd[5]) * 100) : 0 },
      h1n: nf.format(Math.round(2262 * ease)).replace(/\s/g, ','),
      ...this.skyVals(DEPS, S, cur, nf, nf1, M),
      tick: [...TICK, ...TICK].map((k) => ({ n: k[0], d: k[2], s: `S/ ${nf.format(Math.round(k[1]))} M` })),
    };
  }
}
</script>
