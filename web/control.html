<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obra Parada · Servicios de control</title>
<meta name="description" content="Los 4,386 servicios de control de la Contraloría a las obras paralizadas: tipos, años, órganos, obras más revisadas e informes.">
<meta property="og:title" content="Obra Parada · Servicios de control">
<meta property="og:description" content="Los 4,386 servicios de control de la Contraloría a las obras paralizadas: tipos, años, órganos, obras más revisadas e informes.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="vendor/fonts.css" rel="stylesheet">
<style>
body{margin:0;background:#e3e4e1;color:#1f2326;font-family:'Barlow',system-ui,sans-serif;overflow-x:clip}
a{color:#17457a}a:hover{color:#0f3359}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
.prog{position:fixed;top:0;left:0;right:0;height:4px;background:#e9a21a;transform-origin:0 50%;transform:scaleX(0);z-index:60}
@supports (animation-timeline: scroll()){.prog{animation:prog linear both;animation-timeline:scroll(root)}}
@keyframes prog{to{transform:scaleX(1)}}
.brand{display:inline-flex;align-items:center;gap:10px;font:800 24px/1 'Barlow Condensed',sans-serif;color:#1f2326;text-decoration:none}
.brand:hover{color:#1f2326}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font:600 18px/1 'Barlow Condensed',sans-serif;color:#1f2326;text-decoration:none}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:3px;background:#e9a21a;transform:scaleX(0);transform-origin:0 50%;transition:transform .25s ease}
.nav a:hover::after{transform:scaleX(1)}
.nav a.on{background:#1f2326;color:#fff}
.nav a.on::after{display:none}
.sub a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1.5px solid #1f2326;margin:0 0 -1.5px -1.5px;font:600 16px 'Barlow Condensed',sans-serif;color:#1f2326;text-decoration:none;background:#f4f5f3;transition:background-color .2s}
.sub a:hover{background:#fbe7bd}
.sub a.on{background:#e9a21a}
.tape{height:14px;background:repeating-linear-gradient(45deg,#e9a21a 0 10px,#1f2326 10px 20px);background-size:28.28px 14px;animation:tape 1.4s linear infinite}
@keyframes tape{to{background-position:28.28px 0}}
.sec{max-width:1280px;margin:0 auto;padding:72px 32px;scroll-margin-top:120px}
.kick{margin:0 0 8px;font:600 18px 'Barlow Condensed',sans-serif;color:#8a5a00;letter-spacing:.04em}
.h2{margin:0;font:800 clamp(34px,4.2vw,58px)/0.98 'Barlow Condensed',sans-serif}
.note{color:#5d6468;max-width:70ch}
.stat dt{font-size:14px;color:#b9c2c8}
.stat dd{margin:4px 0 0;font:800 clamp(40px,4.4vw,64px)/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.big{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:60px;padding:0 28px 0 10px;border:0;border-radius:32px;background:#1f2326;color:#fff;font:700 21px 'Barlow Condensed',sans-serif;cursor:pointer;box-shadow:0 10px 22px -12px rgba(0,0,0,.6);transition:transform .2s,box-shadow .2s,background-color .2s}
.big:hover{transform:translateY(-3px);box-shadow:0 16px 28px -14px rgba(0,0,0,.6);background:#17457a}
.big:active{transform:translateY(0)}
.big .ic{width:44px;height:44px;border-radius:50%;background:#e9a21a;color:#1f2326;display:grid;place-items:center;transition:transform .5s cubic-bezier(.2,.9,.3,1.4)}
.big:hover .ic{transform:rotate(180deg)}
.big.amber{background:#e9a21a;color:#1f2326}
.big.amber .ic{background:#1f2326;color:#e9a21a}
.big.amber:hover{background:#ffd27a}
.seg button,.chip{min-height:44px;padding:0 16px;border:1.5px solid #1f2326;background:#f4f5f3;font:600 17px 'Barlow Condensed',sans-serif;cursor:pointer;color:#1f2326;margin-left:-1.5px;transition:background-color .2s,color .2s}
.seg button:hover,.chip:hover{background:#e8ebee}
.seg button.on,.chip.on{background:#1f2326;color:#fff}
.stack{display:flex;height:60px;border:2px solid #1f2326}
.stack span{display:flex;align-items:center;padding:0 12px;font:600 17px 'Barlow Condensed',sans-serif;white-space:nowrap;overflow:hidden;transition:flex-grow .4s}
.stack span:hover{flex-grow:1.6!important}
.brow{display:grid;grid-template-columns:minmax(0,18em) minmax(0,1fr) 5em;gap:14px;align-items:center;padding:7px 8px;transition:background-color .15s}
.brow:hover{background:#fbe7bd}
.track{height:16px;background:#d3d5d2}
.track i{display:block;height:100%;background:#17457a;transform-origin:0 50%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.yc{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;text-align:center}
.yc i{display:block;background:#17457a;transition:background-color .25s,opacity .25s;transform-origin:50% 100%}
.yc:hover i{background:#5b84ad}
.yc.on i,.yc.lit i{background:#e9a21a}
.yc.dim i{opacity:.2}
.yc:focus-visible{outline:3px solid #e9a21a}
.yc b{font:700 14px 'Barlow Condensed',sans-serif;margin-bottom:4px;opacity:0;transition:opacity .2s}
.yc:hover b,.yc.on b,.yc.lit b{opacity:1}
.mir{display:grid;grid-template-columns:6em minmax(0,1fr) minmax(9em,13em) minmax(0,1fr) 6em;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #b9bdbb}
.mir:hover{background:#f4f5f3}
.ml{height:22px;background:#d3d5d2;display:flex;justify-content:flex-end}
.mr{height:22px;background:#d3d5d2;display:flex}
.ml i,.mr i{display:block;height:100%;transform-origin:100% 50%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ml i{background:#17457a}
.mr i{background:#9aa1a5;transform-origin:0 50%}
.szc{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;padding:0 4px}
.szc i{display:block;background:#17457a;transition:background-color .2s}
.szc:hover i,.szc.on i{background:#e9a21a}
.szc:focus-visible{outline:3px solid #e9a21a}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;cursor:pointer;color:#fff;font:inherit;transition:transform .25s cubic-bezier(.2,.9,.3,1.4),box-shadow .25s,background-color .5s}
.tile:hover,.tile:focus-visible{transform:translateY(-4px) scale(1.07);box-shadow:0 12px 20px -10px rgba(0,0,0,.5);z-index:2;outline:none}
.tile.sel{box-shadow:0 0 0 3px #e9a21a,0 0 0 6px #1f2326;z-index:3}
.tile .ab{position:absolute;left:6px;top:5px;font:800 15px/1 'Barlow Condensed',sans-serif}
.tile .vv{position:absolute;right:6px;bottom:5px;font:700 13px/1 'Barlow Condensed',sans-serif}
.cell{all:unset;box-sizing:border-box;cursor:pointer;height:44px;display:grid;place-items:center;font:700 13px 'Barlow Condensed',sans-serif;transition:transform .15s,box-shadow .15s}
.cell:hover,.cell:focus-visible,.cell.on{transform:scale(1.12);box-shadow:0 0 0 2px #1f2326;position:relative;z-index:2}
.gapc{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center}
.gapc i{display:block;background:#5b84ad;transition:background-color .2s}
.gapc.neg i{background:#b9bdbb}
.gapc.med i{background:#17457a}
.gapc:hover i,.gapc.on i{background:#e9a21a}
.game{background:#1f2326;color:#fff;padding:32px;border-left:6px solid #e9a21a}
.gopt{all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 260px;min-height:170px;padding:22px;border:2px solid #5d6468;display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:transform .2s,border-color .2s,background-color .3s}
.gopt:hover,.gopt:focus-visible{transform:translateY(-4px);border-color:#e9a21a}
.gopt.ok{background:#2f7d4f;border-color:#9ee0b0;animation:pop .5s cubic-bezier(.2,.9,.3,1.6)}
.gopt.bad{background:#7a2e22;border-color:#ff9b8a;animation:shake .45s}
.gopt.mute{opacity:.6}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.streak{display:inline-flex;gap:6px}
.streak i{width:14px;height:14px;border-radius:50%;background:#3a4044;transition:background-color .3s,transform .3s}
.streak i.on{background:#e9a21a;transform:scale(1.2)}
.lot{perspective:1400px;max-width:820px;margin:0 auto}
.lot-in{position:relative;min-height:360px;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.3,.4,1)}
.lot.on .lot-in{transform:rotateY(180deg)}
.lot.spin .lot-in{animation:baraja .6s ease-in-out}
@keyframes baraja{50%{transform:rotateY(90deg) scale(.92)}}
.lf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:36px;display:flex;flex-direction:column;gap:12px}
.lf.front{background:repeating-linear-gradient(45deg,#17457a 0 18px,#123a66 18px 36px);color:#fff;align-items:center;justify-content:center;text-align:center}
.lf.back{background:#f4f5f3;border:2px solid #1f2326;border-top:8px solid #e9a21a;transform:rotateY(180deg)}
.card{background:#f4f5f3;border:1.5px solid #b9bdbb;border-top:5px solid #17457a;padding:20px 22px;display:flex;flex-direction:column;gap:8px;animation:entra .4s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:#1f2326;border-top-color:#e9a21a}
@keyframes entra{from{opacity:0;transform:translateY(16px)}}
.pdf{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;background:#17457a;color:#fff;text-decoration:none;font:600 18px 'Barlow Condensed',sans-serif;align-self:flex-start;transition:background-color .2s}
.pdf:hover{background:#0f3359;color:#fff}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 4px;border-top:1px solid #b9bdbb;transition:background-color .15s,padding .15s}
.li:hover{background:#f4f5f3;padding-left:12px}
.insight{background:#fbe7bd;border-left:5px solid #e9a21a;padding:16px 20px;font:600 20px/1.3 'Barlow Condensed',sans-serif;margin-top:24px}
@supports (animation-timeline: view()){
.rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
.grow{animation:grow linear both;animation-timeline:view();animation-range:entry 20% cover 50%}
.rise{animation:rise linear both;animation-timeline:view();animation-range:entry 10% cover 45%}
}
@keyframes rv{from{opacity:0;transform:translateY(40px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}
@media (max-width:760px){.brow{grid-template-columns:minmax(0,1fr) 4em}.brow .track{grid-column:1/-1;grid-row:2}.mir{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mir .lab{grid-column:1/-1;grid-row:1}.mir .ml,.mir .mr{display:none}.tile .vv{display:none}.big{width:100%}}
@media (max-width:760px){
header .nav,header nav.sub{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
header .nav{margin-left:0!important;width:100%}
header .nav::-webkit-scrollbar,header nav.sub::-webkit-scrollbar{display:none}
header .nav a{flex:0 0 auto;min-height:40px;padding:0 10px;font-size:16px}
header nav.sub{padding-left:16px!important;padding-right:16px!important}
header nav.sub a{flex:0 0 auto}
}
</style>
<script src="js/dc.js" defer></script>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding: 32px; font: 18px system-ui">Esta página necesita JavaScript. Los datos completos están en <a href="data/obras.json">data/obras.json</a>.</p></noscript>
<template id="vista">
<div style="min-height: 100vh">
<div class="prog" aria-hidden="true"></div>
<header style="position: sticky; top: 0; z-index: 40; background: rgba(227, 228, 225, 0.93); backdrop-filter: blur(8px); border-bottom: 1.5px solid #1f2326">
  <div style="max-width: 1280px; margin: 0 auto; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 32px">
    <a href="index.html" class="brand"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="17" rx="1.5" fill="#17457a"></rect><path d="M9 22v7M23 22v7" stroke="#1f2326" stroke-width="2.2"></path><path d="M8 13h16" stroke="#f4f5f3" stroke-width="2.2"></path></svg>Obra Parada</a>
    <nav class="nav" aria-label="Secciones" style="display: flex; flex-wrap: wrap; margin-left: auto">
      <a href="index.html">Inicio</a>
      <a href="mapa.html">Mapa</a>
      <a href="analisis.html">Análisis</a>
      <a href="comparar.html">Comparar</a>
      <a href="control.html" class="on" aria-current="page">Servicios de control</a>
      <a href="metodo.html">Cómo se hizo</a>
      <a href="explorador.html">Explorador</a>
    </nav>
  </div>
  <div style="border-top: 1px solid #b9bdbb">
    <nav class="sub" aria-label="En esta página" style="max-width: 1280px; margin: 0 auto; padding: 8px 32px 9.5px 33.5px; display: flex; flex-wrap: wrap">
      <template sc-for list="{{subnav}}" as="s" hint-placeholder-count="7"><a href="{{s.href}}" class="{{s.cls}}">{{s.label}}</a></template>
    </nav>
  </div>
</header>

<section style="background: #1f2326; color: #fff">
  <div style="max-width: 1280px; margin: 0 auto; padding: 64px 32px 56px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-end">
    <div style="flex: 1 1 480px; min-width: 0">
      <p style="margin: 0 0 10px; font: 600 18px 'Barlow Condensed', sans-serif; color: #e9a21a">05 · ANEXO N.° 02</p>
      <h1 style="margin: 0 0 18px; font: 800 clamp(44px, 5.6vw, 80px)/0.95 'Barlow Condensed', sans-serif">Lo que la Contraloría revisó en estas obras</h1>
      <p style="margin: 0; max-width: 56ch; font-size: 19px; color: #c9d1d6">Cada servicio de control es una visita, un control concurrente, una orientación o una auditoría a una obra de la lista. Aquí puedes ver a cuáles llegó, cuándo, dónde y quién lo hizo.</p>
    </div>
    <dl class="stat" style="flex: 1 1 420px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 32px; margin: 0">
      <div><dt>Servicios de control</dt><dd style="color: #e9a21a">{{c1}}</dd></div>
      <div><dt>Obras revisadas</dt><dd>{{c2}}</dd></div>
      <div><dt>Obras sin ningún control</dt><dd>{{c3}}</dd></div>
      <div><dt>Con informe en PDF</dt><dd>{{c4}}</dd></div>
    </dl>
  </div>
</section>
<div class="tape" aria-hidden="true"></div>

<section class="sec" id="panorama">
  <p class="kick">PANORAMA</p>
  <h2 class="h2 rv" style="margin-bottom: 20px">El 95% es control simultáneo: mientras la obra avanza</h2>
  <div class="stack rv" role="img" aria-label="Control simultáneo 4,165; posterior 150; previo 71">
    <span style="flex-grow: 4165; flex-basis: 0; background: #17457a; color: #fff">Simultáneo · 4,165</span>
    <span style="flex-grow: 380; flex-basis: 0; background: #e9a21a">Posterior · 150</span>
    <span style="flex-grow: 280; flex-basis: 0; background: #f4f5f3">Previo · 71</span>
  </div>
  <p style="margin: 10px 0 40px; font-size: 14px; color: #5d6468">Posterior y previo se dibujan un poco más anchos de lo que les toca para que se puedan leer.</p>
  <div style="display: flex; flex-wrap: wrap; gap: 48px">
    <div style="flex: 1 1 500px; min-width: 0">
      <h3 style="margin: 0 0 14px; font: 700 28px 'Barlow Condensed', sans-serif">Tipo de acción</h3>
      <div class="rv">
        <template sc-for list="{{acciones}}" as="a" hint-placeholder-count="6">
          <div class="brow"><span style="font-size: 15px">{{a.n}}</span><span class="track" aria-hidden="true"><i class="grow" style="width: {{a.w}}%"></i></span><span style="text-align: right; font: 700 17px 'Barlow Condensed', sans-serif">{{a.v}}</span></div>
        </template>
      </div>
    </div>
    <div style="flex: 1 1 300px; min-width: 0">
      <h3 style="margin: 0 0 14px; font: 700 28px 'Barlow Condensed', sans-serif">Cuántos controles tuvo cada obra</h3>
      <div class="rv" style="display: flex; gap: 6px; height: 200px; border-bottom: 2px solid #1f2326">
        <template sc-for list="{{hist}}" as="h" hint-placeholder-count="7">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; text-align: center"><b style="font: 700 14px 'Barlow Condensed', sans-serif; margin-bottom: 4px">{{h.n}}</b><i class="rise" style="display: block; height: {{h.h}}%; background: {{h.c}}"></i></div>
        </template>
      </div>
      <div style="display: flex; gap: 6px; margin-top: 6px"><template sc-for list="{{hist}}" as="h" hint-placeholder-count="7"><span style="flex: 1; min-width: 0; text-align: center; font-size: 12px; color: #5d6468">{{h.l}}</span></template></div>
      <p style="margin: 12px 0 0; font-size: 14px; color: #5d6468">Ninguno, uno, dos… hasta más de 20. 22 obras tuvieron más de 20 servicios de control.</p>
    </div>
  </div>
</section>

<div class="tape" aria-hidden="true"></div>

<section class="sec" id="sirve">
  <p class="kick">¿A QUÉ OBRAS LLEGA EL CONTROL?</p>
  <h2 class="h2" style="margin-bottom: 12px; max-width: 22ch">Las revisadas son más grandes y están más avanzadas</h2>
  <p class="note" style="margin: 0 0 24px">1,239 obras con al menos un servicio de control (azul) frente a 1,023 sin ninguno (gris). Es una relación, no prueba que el control cause el avance.</p>
  <div class="rv">
    <div class="mir" style="border-top: 0; padding-bottom: 4px"><b style="color: #17457a; font: 700 18px 'Barlow Condensed', sans-serif">Con control</b><span></span><span></span><span></span><b style="text-align: right; color: #5d6468; font: 700 18px 'Barlow Condensed', sans-serif">Sin control</b></div>
    <template sc-for list="{{mirror}}" as="m" hint-placeholder-count="6">
      <div class="mir">
        <span style="font: 700 22px 'Barlow Condensed', sans-serif; color: #17457a">{{m.a}}</span>
        <span class="ml" aria-hidden="true"><i style="width: {{m.wa}}%"></i></span>
        <span class="lab" style="text-align: center; font-size: 15px; color: #5d6468">{{m.l}}</span>
        <span class="mr" aria-hidden="true"><i style="width: {{m.wb}}%"></i></span>
        <span style="text-align: right; font: 700 22px 'Barlow Condensed', sans-serif; color: #5d6468">{{m.b}}</span>
      </div>
    </template>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 48px; margin-top: 56px">
    <div style="flex: 1 1 460px; min-width: 0">
      <h3 style="margin: 0 0 6px; font: 700 28px 'Barlow Condensed', sans-serif">Mientras más falta, más se revisa</h3>
      <p class="note" style="margin: 0 0 14px">% de obras con al menos un control, según lo que les falta ejecutar. Clic en una columna.</p>
      <div class="rv" style="display: flex; gap: 10px; height: 240px; border-bottom: 2px solid #1f2326">
        <template sc-for list="{{sizes}}" as="s" hint-placeholder-count="5">
          <button type="button" class="{{s.cls}}" onClick="{{s.pick}}" aria-label="{{s.aria}}"><b style="font: 700 17px 'Barlow Condensed', sans-serif; margin-bottom: 4px">{{s.p}}</b><i class="rise" style="height: {{s.h}}%"></i></button>
        </template>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 6px"><template sc-for list="{{sizes}}" as="s" hint-placeholder-count="5"><span style="flex: 1; min-width: 0; text-align: center; font-size: 13px; color: #5d6468">{{s.l}}</span></template></div>
      <div class="insight">{{sizeLine}}</div>
    </div>
    <div style="flex: 1 1 460px; min-width: 0">
      <h3 style="margin: 0 0 6px; font: 700 28px 'Barlow Condensed', sans-serif">Según la causa de paralización</h3>
      <p class="note" style="margin: 0 0 14px">% de obras de cada causa que tuvieron al menos un control.</p>
      <div class="rv">
        <template sc-for list="{{causas}}" as="c" hint-placeholder-count="10">
          <div class="brow"><span style="font-size: 14.5px">{{c.n}}</span><span class="track" aria-hidden="true"><i class="grow" style="width: {{c.w}}%; background: {{c.bg}}"></i></span><span style="text-align: right; font: 700 17px 'Barlow Condensed', sans-serif">{{c.v}}</span></div>
        </template>
      </div>
      <p class="note" style="margin: 12px 0 0; font-size: 14px">Las obras en arbitraje son las más revisadas (74%); las paradas por falta de plata, de las menos (44%).</p>
    </div>
  </div>
</section>

<div class="tape" aria-hidden="true"></div>

<section class="sec" id="donde">
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 28px">
    <div><p class="kick">DÓNDE</p><h2 class="h2">El mapa del control</h2></div>
    <div class="seg" role="group" aria-label="Medir por" style="display: flex; flex-wrap: wrap">
      <template sc-for list="{{dMetrics}}" as="m" hint-placeholder-count="3"><button type="button" class="{{m.cls}}" onClick="{{m.pick}}">{{m.l}}</button></template>
    </div>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
    <div style="flex: 1 1 380px; min-width: 0; max-width: 460px">

  componentDidMount() {
    const start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - start) / 1400);

    this.raf = requestAnimationFrame(step);
    this.onScroll = () => {
      let cur = 'panorama';
      for (const id of ['panorama', 'sirve', 'donde', 'cuando', 'juego', 'obras', 'azar', 'buscar']) {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top < window.innerHeight * 0.4) cur = id;
      }
      if (cur !== this.state.active) this.setState({ active: cur });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.newRound();
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); clearInterval(this.yt); window.removeEventListener('scroll', this.onScroll); }

    const D = this.DEPS().filter((d) => d[6] >= 10);

    const SIZES = [['Menos de S/ 1 M',1298,45.5],['S/ 1-5 M',545,59.6],['S/ 5-20 M',267,72.3],['S/ 20-100 M',110,88.2],['Más de S/ 100 M',42,81.0]];
    const CAUS = [["Discrepancias, controversias y arbitraje",74.1],["Disponibilidad de terreno",65.5],["Incumplimiento de contrato",65.4],["Deficiencia en el expediente técnico",60.4],["Incumplimiento del pago de valorizaciones",56.9],["Falta de permisos y licencias",52.1],["Eventos climáticos",50.6],["Conflictos sociales",50.0],["Abandono de obra",48.1],["Falta de recursos financieros y liquidez",43.7],["Desabastecimiento de materiales",36.9]];
    const ENT = [["Ministerio de Vivienda, Construcción y Saneamiento",207],["Provías Descentralizado",166],["Ministerio de Transportes y Comunicaciones",166],["Gobierno Regional Arequipa",117],["Provías Nacional",114],["Gobierno Regional Áncash",83]];
    const INF = [
      [2024,"Control simultáneo","Visita de control","Liquidación de obra y ejecución de laudos arbitrales del Consorcio Libertadores","008-2024-OCI/0052-SVC","Ministerio de Desarrollo Agrario y Riego","Construcción de represa y sistema de riego Tantar","Ayacucho","2024CSI005200008"],
      [2021,"Control simultáneo","Control concurrente","Ejecución de la obra Mejoramiento colectores quebradas Saphy, Av. Sol, Tullumayu y Av. Ejército","009-2021-OCI/0385-SCC","Municipalidad Provincial del Cusco","Mejoramiento colectores quebradas Saphy, Av. Sol, Tullumayo y Av. Ejército","Cusco","2021CSI038500044"],
      [2025,"Control simultáneo","Control concurrente","Mejoramiento del sistema de agua potable y alcantarillado del centro poblado Boquerón","005-2025-OCI/2684-SCC","Municipalidad Provincial de Padre Abad","Agua potable y alcantarillado del centro poblado Boquerón","Ucayali","2025CSI268400010"],
      [2023,"Control simultáneo","Control concurrente","Hito de control N.° 13: ejecución de obra, valorización N.° 48","011-2023-OCI/5303-SCC","Ministerio de Vivienda, Construcción y Saneamiento","Sectorización del sistema de agua potable y alcantarillado de la parte alta de Chorrillos","Lima","2023CSI530300011"],
      [2018,"Control simultáneo","Visita de control","Verificación a la ejecución del servicio de supervisión","002-2018-OCI/3472-VC","EPSEL S.A.","Plan maestro de saneamiento, agua potable y tratamiento de aguas residuales","Lambayeque","2018CSI347200002"],
      [2021,"Control simultáneo","Control concurrente","Proyecto Fortalecimiento de los servicios de salud del Hospital Regional de Pucallpa","001-2021-CG/MPROY-SCC","Subgerencia de Control de Megaproyectos","Hospital Regional de Pucallpa","Ucayali","2021CSIL33400010"],
      [2018,"Control simultáneo","Visita de control","A la ejecución de la obra Soterrado de la línea 33 kV Chilina - Challapampa","003-2018-OCI/5183-VC","Sociedad Eléctrica del Sur Oeste (SEAL)","Soterrado de la línea de 33 kV Chilina - Challapampa","Arequipa","2019CSI518300021"],
      [2019,"Control simultáneo","Visita de control","Visita de control a la obra Mejoramiento del servicio de agua del sistema de riego Querco - Quichua","005-2019-OCI/5747-SVC","Gerencia Sub Regional de Huaytará","Sistema de riego Querco - Quichua","Huancavelica","2019CSI574700006"],
      [2026,"Control simultáneo","Control concurrente","Elaboración del expediente técnico del saldo de obra del puente Tingo María - Castillo Grande","008-2026-OCI/5339-SCC","Gobierno Regional Huánuco","Construcción del puente Tingo María - Castillo Grande","Huánuco","2026CSI533900008"],
    ];
    const DEPS = this.DEPS();
    const st = this.state;
    const nf = new Intl.NumberFormat('es-PE');
    const nf1 = new Intl.NumberFormat('es-PE', { maximumFractionDigits: 1 });
    const t = 1 - Math.pow(1 - st.t, 3);
    const n = (v) => nf.format(Math.round(v * t));

    // Mapa del control
    const DM = {
      sv: ['Servicios', (d) => d[5], (v) => nf.format(v)],
      po: ['Controles por obra', (d) => d[5] / d[6], (v) => nf1.format(v)],
      pr: ['% de obras revisadas', (d) => (d[7] / d[6]) * 100, (v) => `${Math.round(v)}%`],
    };
    const [dLabel, dGet, dFmt] = DM[st.dm];
    const dvals = DEPS.map(dGet);
    const dMax = Math.max(...dvals), dMin = Math.min(...dvals);
    const shade = (v) => {
      const k = (v - dMin) / (dMax - dMin || 1);
      const c0 = [188, 203, 217], c1 = [18, 58, 102];
      return `rgb(${c0.map((x, i) => Math.round(x + (c1[i] - x) * k)).join(',')})`;
    };
    const order = [...DEPS].sort((a, b) => dGet(b) - dGet(a));
    const grid = [];
    for (let r = 0; r < 8; r++) for (let c = 0; c < 5; c++) grid.push(DEPS.findIndex((d) => d[3] === c && d[4] === r));
    const tiles = grid.map((k) => {
      if (k < 0) return { empty: true, real: false };
      const d = DEPS[k], v = dGet(d), dark = (v - dMin) / (dMax - dMin || 1) > 0.45;
      return {
        empty: false, real: true, ab: d[2], v: dFmt(v), bg: shade(v), fg: dark ? '#fff' : '#1f2326', delay: (d[4] * 5 + d[3]) * 20,
        cls: st.dsel === d[0] ? 'tile sel' : 'tile', aria: `${d[1]}: ${dFmt(v)} ${dLabel.toLowerCase()}`,
        pick: () => this.setState({ dsel: d[0] }),
      };
    });
    const ds = DEPS.find((d) => d[0] === st.dsel);

    // Juego
    const ga = DEPS.find((d) => d[0] === st.g[0]), gb = DEPS.find((d) => d[0] === st.g[1]);
    const r = (d) => d[5] / d[6];
    const winner = r(ga) > r(gb) ? ga[0] : gb[0];
    const choose = (id) => () => {
      if (this.state.gPick) return;
      const ok = id === winner;
      const s = ok ? this.state.gStreak + 1 : 0;
      this.setState({ gPick: id, gStreak: s, gBest: Math.max(this.state.gBest, s) });
    };

    // Año por año y matriz
    const py = st.py;
    const cum = YEARS.filter((y) => !py || y[0] <= py).reduce((s, y) => s + y[1], 0);
    const yMax = Math.max(...YEARS.map((y) => y[1]));
    const matMax = Math.max(...MAT.flat());
    const cell = st.cell;
    const gMax = Math.max(...GAP.map((g) => g[1]));
    const gSel = GAP.find((g) => g[0] === st.gap) || GAP[4];
    const sz = SIZES[st.size];
    const sMax = Math.max(...SIZES.map((s) => s[2]));

    // Buscador
    const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const words = norm(st.q).trim().split(/\s+/).filter(Boolean);
    const found = INF.filter((x) => (!st.year || x[0] === st.year) && (!st.acc || x[2] === st.acc) && words.every((w) => norm(x.join(' ')).includes(w))).sort((a, b) => b[0] - a[0]);
    const filtros = [st.year, st.acc, st.q.trim()].filter(Boolean);
    const L = INF[st.lot];
    const labels = { panorama: 'Panorama', sirve: '¿A qué obras llega?', donde: 'Dónde', cuando: 'Cuándo', juego: 'Juego', obras: 'Obras y entidades', azar: 'Al azar', buscar: 'Buscar' };
    const accMax = ACC[0][1];
    const hMax = HIST[0][0];
    const MIR = [
      ['Avance mediano', 59.8, 54.4, (v) => `${nf1.format(v)}%`],
      ['Costo mediano', 5.15, 1.3, (v) => `S/ ${nf1.format(v)} M`],
      ['Lo que les falta (mediana)', 1.14, 0.37, (v) => `S/ ${nf1.format(v)} M`],
      ['Al 90% o más', 13.4, 11.7, (v) => `${nf1.format(v)}%`],
      ['Con presupuesto este año', 39.6, 25.2, (v) => `${nf1.format(v)}%`],
      ['En la lista priorizada', 9.2, 5.0, (v) => `${nf1.format(v)}%`],
    ];
    return {
      subnav: Object.keys(labels).map((k) => ({ href: `#${k}`, label: labels[k], cls: k === st.active ? 'on' : '' })),
      c1: n(4386), c2: n(1239), c3: n(1023), c4: n(3630),
      acciones: ACC.map((a) => ({ n: a[0], w: ((a[1] / accMax) * 100).toFixed(1), v: nf.format(a[1]) })),
      hist: HIST.map((h, i) => ({ n: nf.format(h[0]), l: h[1], h: Math.max(2, Math.round((h[0] / hMax) * 100)), c: i === 0 ? '#9aa1a5' : '#17457a' })),
      mirror: MIR.map(([l, a, b, f]) => { const m = Math.max(a, b); return { l, a: f(a), b: f(b), wa: ((a / m) * 100).toFixed(1), wb: ((b / m) * 100).toFixed(1) }; }),
      sizes: SIZES.map((s, i) => ({
        l: s[0], p: `${nf1.format(s[2])}%`, h: Math.round((s[2] / sMax) * 100),
        cls: i === st.size ? 'szc on' : 'szc', aria: `${s[0]}: ${nf1.format(s[2])}% de ${nf.format(s[1])} obras revisadas`,
        pick: () => this.setState({ size: i }),
      })),
      sizeLine: `${sz[0]}: ${nf.format(sz[1])} obras, ${nf1.format(sz[2])}% tuvo al menos un control. ${st.size === 0 ? 'Las chicas son la mayoría y menos de la mitad fue revisada.' : st.size >= 3 ? 'En las grandes, casi todas pasan por control.' : 'A más dinero en juego, más control.'}`,
      causas: CAUS.map((c) => ({ n: c[0], v: `${nf1.format(c[1])}%`, w: c[1].toFixed(1), bg: c[1] >= 60 ? '#17457a' : c[1] < 45 ? '#9aa1a5' : '#5b84ad' })),
      dMetrics: Object.keys(DM).map((k) => ({ l: DM[k][0], cls: k === st.dm ? 'on' : '', pick: () => this.setState({ dm: k }) })),
      tiles,
      dsel: {
        name: ds[1], rank: order.indexOf(ds) + 1, metric: dLabel.toLowerCase(), sv: nf.format(ds[5]),
        po: nf1.format(ds[5] / ds[6]), pr: `${Math.round((ds[7] / ds[6]) * 100)}%`, w: Math.round((ds[7] / ds[6]) * 100),
        line: `${ds[7]} de sus ${ds[6]} obras paralizadas tuvieron al menos un servicio de control.`,
      },
      dTop: order.slice(0, 5).map((d) => ({ n: d[1], v: dFmt(dGet(d)) })),
      playYears: () => this.playYears(),
      cumTxt: py ? `${py}: ${nf.format(cum)} servicios` : `${nf.format(cum)} servicios`,
      cumNote: py ? 'Acumulados desde 2015.' : 'Clic en un año para filtrar los informes del buscador.',
      oTot: st.org ? '' : 'on', oOrg: st.org ? 'on' : '', orgView: st.org,
      showTot: () => this.setState({ org: false }), showOrg: () => this.setState({ org: true }),
      years: YEARS.map((y) => ({
        n: st.org ? `${Math.round((y[2] / y[1]) * 100)}% OCI` : nf.format(y[1]),
        h: Math.max(2, Math.round((y[1] / yMax) * 100)),
        ha: Math.max(1, Math.round((y[2] / yMax) * 100)), hb: Math.round((y[3] / yMax) * 100),
        org: st.org, tot: !st.org, l: `’${String(y[0]).slice(2)}`,
        cls: py ? (y[0] < py ? 'yc' : y[0] === py ? 'yc lit' : 'yc dim') : (y[0] === st.year ? 'yc on' : 'yc'),
        pressed: String(y[0] === st.year), aria: `${y[0]}: ${nf.format(y[1])} servicios; ${y[2]} del OCI y ${y[3]} de la Contraloría`,
        pick: () => this.setState({ year: st.year === y[0] ? null : y[0] }),
      })),
      yearLbl: YEARS.map((y) => ({ l: `’${String(y[0]).slice(2)}` })),
      matrix: MAT.map((row, i) => ({
        n: MAT_N[i],
        cells: row.map((v, j) => {
          const k = v / matMax, on = cell && cell[0] === i && cell[1] === j;
          return {
            t: v ? nf.format(v) : '', bg: v ? `rgba(23, 69, 122, ${(0.12 + 0.88 * Math.sqrt(k)).toFixed(2)})` : '#eceeeb',
            fg: k > 0.25 ? '#fff' : '#1f2326', cls: on ? 'cell on' : 'cell',
            aria: `${MAT_N[i]} en ${YEARS[j][0]}: ${v}`, hover: () => this.setState({ cell: [i, j] }),
          };
        }),
      })),
      cellTxt: cell ? `${MAT_N[cell[0]]} en ${YEARS[cell[1]][0]}: ${nf.format(MAT[cell[0]][cell[1]])} servicios` : 'El control concurrente despega en 2019, justo cuando la acción simultánea deja de usarse.',
      gaps: GAP.map((g) => ({
        h: Math.max(2, Math.round((g[1] / gMax) * 100)),
        l: g[0] === -3 ? '≤-3' : g[0] === 15 ? '15+' : String(g[0]),
        cls: `gapc${g[0] < 0 ? ' neg' : ''}${g[0] === 1 ? ' med' : ''}${g[0] === st.gap ? ' on' : ''}`,
        aria: `${g[0]} años: ${nf.format(g[1])} servicios`, pick: () => this.setState({ gap: g[0] }),
      })),
      gapLine: gSel[0] < 0
        ? `${nf.format(gSel[1])} servicios son de ${Math.abs(gSel[0])}${gSel[0] === -3 ? ' o más' : ''} año${gSel[0] === -1 ? '' : 's'} antes del año de inicio registrado: controles previos o fechas que no cuadran en la fuente.`
        : `${nf.format(gSel[1])} servicios llegaron ${gSel[0] === 0 ? 'el mismo año en que empezó la obra' : `${gSel[0]}${gSel[0] === 15 ? ' o más' : ''} año${gSel[0] === 1 ? '' : 's'} después del inicio`}. La mediana es 1 año.`,
      streak: [0, 1, 2, 3, 4].map((i) => ({ cls: i < st.gStreak ? 'on' : '' })),
      gStreak: st.gStreak, gBest: st.gBest,
      gOpts: [ga, gb].map((d) => ({
        name: d[1],
        reveal: st.gPick ? `${nf1.format(r(d))} controles por obra · ${d[5]} servicios en ${d[6]} obras` : 'Clic para elegir',
        cls: !st.gPick ? 'gopt' : d[0] === winner ? 'gopt ok' : d[0] === st.gPick ? 'gopt bad' : 'gopt mute',
        pick: choose(d[0]),
      })),
      gMsg: !st.gPick ? 'Elige uno.' : st.gPick === winner ? '¡Bien! Sigue la racha.' : 'No. La racha vuelve a cero.',
      gNext: () => this.newRound(),
      gNextLabel: st.gPick ? 'Siguiente pareja' : 'Saltar',
      masRev: [
        ["Reconstrucción y ampliación de represa y canal Pancán", 102, "Áncash · falta S/ 350 mil"],
        ["Canal de conducción Vilachaullani - Calachaca - Chuapalca", 81, "Tacna · falta S/ 202.5 M"],
        ["Energía eléctrica por sistema convencional en la comunidad de Jaccas", 63, "Cusco · falta S/ 39 mil"],
        ["Servicios de salud del Hospital Regional de Pucallpa", 56, "Ucayali · falta S/ 190.9 M"],
        ["Carretera variante de Uchumayo", 54, "Arequipa · falta S/ 73 M"],
      ].map((o) => ({ n: o[0], c: o[1], m: o[2] })),
      sinCtrl: [
        ["Terminal terrestre municipal en la localidad de Jesús", "S/ 1.3 mil M", "Huánuco · 94% de avance"],
        ["Sistema integral de agua potable y alcantarillado", "S/ 365.2 M", "Huánuco · 27.6% de avance"],
        ["Acciones de comando en los puestos de los batallones de selva", "S/ 336.8 M", "Loreto · 0.9% de avance"],
        ["Obra principal del proyecto de servicios de salud", "S/ 283.9 M", "La Libertad · 0.7% de avance"],
        ["Establecimiento de salud Simón Bolívar", "S/ 282.4 M", "Cajamarca · 0.3% de avance"],
      ].map((o) => ({ n: o[0], c: o[1], m: o[2] })),
      entidades: ENT.map((e) => ({ n: e[0], v: nf.format(e[1]), w: ((e[1] / ENT[0][1]) * 100).toFixed(1) })),
      lotCls: `lot${st.lotOn ? ' on' : ''}${st.lotSpin ? ' spin' : ''}`,
      lot: { anio: L[0], tipo: L[1], acc: L[2], t: L[3], num: L[4], org: L[5], obra: L[6], dep: L[7], url: `${SPIC}${L[8]}&TIPOARCHIVO=ADJUNTO` },
      shuffle: () => this.shuffle(INF.length),
      shuffleLabel: st.lotOn ? 'Sacar otra carta' : 'Barajar y voltear',
      q: st.q, onQ: (e) => this.setState({ q: e.target.value }),
      accChips: [['', 'Todas'], ['Control concurrente', 'Concurrente'], ['Visita de control', 'Visitas']].map(([v, l]) => ({ l, cls: st.acc === v ? 'chip on' : 'chip', pick: () => this.setState({ acc: v }) })),
      countTxt: found.length ? `${found.length} ${found.length === 1 ? 'informe' : 'informes'}${filtros.length ? ` con: ${filtros.join(' · ')}` : ''}` : 'Ningún informe con estos filtros. Prueba con otro año o sin texto.',
      found: found.map((x, i) => ({ anio: x[0], tipo: x[1], acc: x[2], t: x[3], num: x[4], org: x[5], obra: x[6], dep: x[7], url: `${SPIC}${x[8]}&TIPOARCHIVO=ADJUNTO`, delay: i * 50 })),
    };
  }
}
</script>
</body>
