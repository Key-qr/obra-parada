# Publica la carpeta web en GitHub Pages.
# Corre con cada push a main que toque la web y cuando termina el pipeline semanal:
# los commits que hace el pipeline con GITHUB_TOKEN no disparan otros workflows por sí solos.
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [pipeline]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Versión en los archivos para que el navegador no use copias viejas
        # GitHub Pages deja que el navegador guarde cada archivo 10 minutos. Con ?v=<commit> en cada
        # CSS y JS (y en los import entre módulos) una página nueva siempre pide sus archivos nuevos.
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(styles\.css|app\.js|js/dc\.js|js/ayuda\.js)\"#\1=\"\2?v=$v\"#g" web/*.html
          sed -i -E "s#from \"\./(motion|dots|sections|control|buscar|lugares)\.js\"#from \"./\1.js?v=$v\"#g" web/*.js
          grep -o 'styles.css?v=[0-9a-f]*\|app.js?v=[0-9a-f]*\|dc.js?v=[0-9a-f]*\|ayuda.js?v=[0-9a-f]*' web/*.html | sort -u
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
